<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I lock | إدارة المخزون</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#17212b}header{color:#fff;padding:15px 28px;background:linear-gradient(118deg,#102a43,#163b62);display:flex;align-items:center;justify-content:space-between;gap:18px}header h1{margin:0;font-size:21px;letter-spacing:.3px}.sub{opacity:.75;font-size:12px;margin-top:4px}.brand{display:flex;gap:11px;align-items:center}.brand-mark{width:36px;height:36px;border:1px solid #7eb6e9;border-radius:10px;display:grid;place-items:center;font-weight:bold;color:#bce0ff}.header-meta{font-size:12px;display:flex;gap:15px;align-items:center;color:#d4e4f1}.user{background:#ffffff1c;padding:7px 10px;border-radius:8px}nav{display:flex;gap:5px;overflow:auto;background:#fff;padding:9px 22px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e3eaf1;box-shadow:0 2px 8px #102a4308}nav button,.btn{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:bold;font-family:inherit}nav button{background:transparent;color:#526476;font-size:12px;white-space:nowrap}nav button:hover,nav button.active{background:#eaf2fb;color:#0e4f88}.primary{background:#0e4f88;color:#fff}.success{background:#16855b;color:#fff}.danger{background:#c43d3d;color:#fff}.light{background:#edf2f6;color:#30465b}.warning{background:#fff0c9}.tab{display:none}.tab.active{display:block}main{max-width:1540px;margin:auto;padding:22px}.page-title{display:flex;justify-content:space-between;align-items:end;margin:0 0 17px}.page-title h2{margin:0;font-size:21px;color:#193b5b}.page-title p{margin:5px 0 0;font-size:12px;color:#718194}.card{background:#fff;border:1px solid #e0e8ef;border-radius:11px;padding:15px;margin-bottom:14px;box-shadow:0 2px 7px #1d3d5d07}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}label{font-size:11px;color:#687582;font-weight:bold}input,select,textarea{padding:9px;border:1px solid #dbe4ed;border-radius:7px;background:#fff;font-family:inherit;color:#26394d}input:focus,select:focus,textarea:focus{outline:2px solid #b8d9f4;border-color:#5594c8}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px 8px;border-bottom:1px solid #edf1f4;text-align:right;font-size:12px}th{background:#f6f9fc;color:#64788c;font-size:11px}tr:hover td{background:#fbfdff}.table{overflow:auto}.kpi{position:relative;overflow:hidden}.kpi:before{content:'';width:4px;height:100%;right:0;top:0;position:absolute;background:#2878b9}.kpi .v{font-size:25px;font-weight:bold;color:#183b5d;margin-top:5px}.muted{color:#687582}.note,.alert,.danger-note{padding:11px;border-radius:8px;line-height:1.7;font-size:12px}.note{background:#eef6fd;border-right:4px solid #2468a6}.alert{background:#fff4dc;border-right:4px solid #b77a00}.danger-note{background:#fff0f0;border-right:4px solid #c43d3d}.pill{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:bold}.green{background:#e4f5ec;color:#12683d}.red{background:#fde8e8;color:#9d2929}.amber{background:#fff2d1;color:#805800}.blue{background:#e4f0fb;color:#1f5d91}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:25px;color:#687582}.chart{height:280px}.comp{display:flex;gap:8px;align-items:end;margin:7px 0}.comp select{flex:1}.footer{text-align:center;color:#8492a0;font-size:11px;padding:25px}.section-label{font-size:12px;font-weight:bold;color:#4c6175;margin:0 0 10px}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow-step{padding:9px 11px;background:#f1f6fa;border-radius:8px;font-size:12px;color:#36516c}.flow-arrow{color:#86a0b8}.status-dot{display:inline-block;width:7px;height:7px;background:#2bab72;border-radius:50%;margin-left:5px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{padding:12px}.header-meta{display:none}nav{padding:8px}.grid,.grid2,.form{grid-template-columns:1fr}.field.wide{grid-column:auto}main{padding:14px}}
</style></head><body><header><div class="brand"><div class="brand-mark">IL</div><div><h1>I LOCK ERP</h1><div class="sub">منصة عمليات المصنع وإدارة سلسلة الإمداد</div></div></div><div class="header-meta"><span><span class="status-dot"></span>النظام متصل</span><span>المنشأة: مصنع الحقن</span><span class="user">مدير المخزون</span></div></header><nav id="nav"></nav><main><section id="dashboard" class="tab active"></section><section id="stock" class="tab"></section><section id="items" class="tab"></section><section id="families" class="tab"></section><section id="moves" class="tab"></section><section id="counts" class="tab"></section><section id="plans" class="tab"></section><section id="analysis" class="tab"></section><section id="data" class="tab"></section></main><div class="footer">I LOCK ERP • تشغيل محلي آمن على هذا المتصفح • الإصدار 1.0</div><script>
const KEY='ilock_inventory_v5',T=[['dashboard','⌂ لوحة العمليات'],['stock','▣ أرصدة المخازن'],['items','◈ دليل الأصناف'],['families','⚙ قوائم المواد'],['moves','↔ المستندات والحركة'],['counts','✓ الجرد والمطابقة'],['plans','◷ التخطيط والاحتياجات'],['analysis','▥ التقارير والتحليل'],['data','⚙ الإعدادات والبيانات']],S=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('ilock_inventory_v4')||'null')||{items:[],families:[],moves:[],counts:[],plans:[]};S.items.forEach(i=>{if(i.reorderPoint===undefined)i.reorderPoint=0;if(!i.location)i.location='المخزن الرئيسي'});let chart;
const $=id=>document.getElementById(id),N=x=>Number(x)||0,E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),M=x=>N(x).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}),D=()=>new Date().toISOString().slice(0,10),ID=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5),it=c=>S.items.find(x=>x.code===c),save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function sign(t){return ['purchase','production','return','transferIn','adjustmentIn'].includes(t)?1:-1}function qty(m){return m.status==='cancelled'?0:N(m.qty)*sign(m.type)}function stock(c,d=D()){return N(it(c)?.opening)+S.moves.filter(m=>m.code===c&&m.date<=d).reduce((a,m)=>a+qty(m),0)}function cost(c){return N(it(c)?.unitCost)}function nrv(c){let i=it(c);return i&&N(i.sellPrice)>0?Math.max(0,N(i.sellPrice)-N(i.completionCost)-N(i.sellingCost)):null}function value(c,d=D()){return Math.max(0,stock(c,d))*cost(c)}function lower(c,d=D()){let v=value(c,d),r=nrv(c);return r===null?v:Math.min(v,Math.max(0,stock(c,d))*r)}function wd(c,d=D()){return nrv(c)===null?0:Math.max(0,value(c,d)-lower(c,d))}function type(t){return {raw:'خام',finished:'منتج تام',component:'مكون',other:'أخرى'}[t]||t||'—'}function mn(t){return {purchase:'استلام شراء',production:'استلام إنتاج',issue:'صرف طلبية/إنتاج',return:'مرتجع عميل',supplierReturn:'مرتجع للمورد',transferOut:'تحويل صادر',transferIn:'تحويل وارد',adjustmentIn:'تسوية زيادة',adjustmentOut:'تسوية نقص'}[t]||t}function sel(id,val=''){return `<select id="${id}"><option value="">اختر الصنف</option>${S.items.map(i=>`<option value="${E(i.code)}" ${i.code===val?'selected':''}>${E(i.code)} — ${E(i.name)}</option>`).join('')}</select>`}function inp(id,l,v='',t='text'){return `<div class="field"><label>${l}</label><input id="${id}" type="${t}" value="${E(v)}"></div>`}function k(a,b,c=''){return `<div class="card kpi"><div class="muted">${a}</div><div class="v">${E(b)}</div><small class="muted">${c}</small></div>`}
function nav(){ $('nav').innerHTML=T.map((x,i)=>`<button class="${i?'':'active'}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}function show(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',T[i][0]===id));render(id)}function render(id){({dashboard:dash,stock:stockPage,items:itemsPage,families:familiesPage,moves:movesPage,counts:countsPage,plans:plansPage,analysis:analysisPage,data:dataPage}[id])()}
function dash(){let total=S.items.reduce((a,i)=>a+Math.max(0,stock(i.code)),0),val=S.items.reduce((a,i)=>a+value(i.code),0),down=S.items.reduce((a,i)=>a+wd(i.code),0),neg=S.items.filter(i=>stock(i.code)<0).length,low=S.items.filter(i=>stock(i.code)<=N(i.reorderPoint)&&stock(i.code)>=0).length,pending=S.moves.filter(m=>m.status==='active'&&m.date===D()).length;$("dashboard").innerHTML=`<div class="page-title"><div><h2>لوحة التحكم التشغيلية</h2><p>نظرة فورية على المخزون والإنتاج والمخاطر — ${D()}</p></div><div class="actions"><button class="btn primary" onclick="show('moves');moveForm()">+ مستند حركة</button><button class="btn light" onclick="show('counts');countForm()">بدء جرد</button></div></div><div class="grid">${k('قيمة المخزون',M(val),'بالتكلفة الحالية')}${k('الأصناف النشطة',S.items.length,'دليل المواد والمنتجات')}${k('تنبيهات إعادة الطلب',low,'تحتاج تدخلاً')}${k('حركات اليوم',pending,'مستندات مسجلة')}</div><div class="grid2"><div class="card"><div class="section-label">سير عمل المخزون</div><div class="flow"><span class="flow-step">طلب شراء</span><span class="flow-arrow">←</span><span class="flow-step">استلام وفحص</span><span class="flow-arrow">←</span><span class="flow-step">إنتاج / صرف</span><span class="flow-arrow">←</span><span class="flow-step">شحن / تسوية</span></div><div class="note" style="margin-top:15px">الرصيد محسوب من الرصيد الافتتاحي وسجل المستندات. نفّذ الجرد الدوري ثم وثّق التسوية بمستند مستقل لضمان قابلية المراجعة.</div>${neg?`<div class="danger-note" style="margin-top:10px">تنبيه رقابي: يوجد ${neg} صنف برصيد سالب ويتطلب اعتماداً فورياً.</div>`:''}</div><div class="card"><div class="section-label">أعلى قيمة مخزون</div><div class="chart"><canvas id="chart"></canvas></div></div></div><div class="card"><div class="section-label">إجراءات تحتاج متابعة</div><div class="table"><table><thead><tr><th>الصنف</th><th>الموقع</th><th>الرصيد</th><th>حد إعادة الطلب</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${S.items.filter(i=>stock(i.code)<=N(i.reorderPoint)).slice(0,6).map(i=>`<tr><td>${E(i.name)}</td><td>${E(i.location)}</td><td>${M(stock(i.code))}</td><td>${M(i.reorderPoint)}</td><td><span class="pill ${stock(i.code)<0?'red':'amber'}">${stock(i.code)<0?'رصيد سالب':'إعادة طلب'}</span></td><td><button class="btn light" onclick="itemForm('${E(i.code)}');show('items')">عرض الصنف</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد تنبيهات مخزون حالياً.</td></tr>'}</tbody></table></div></div>`;if(chart)chart.destroy();if(window.Chart)chart=new Chart($('chart'),{type:'bar',data:{labels:S.items.slice().sort((a,b)=>value(b.code)-value(a.code)).slice(0,7).map(i=>i.name.slice(0,16)),datasets:[{label:'قيمة المخزون',data:S.items.slice().sort((a,b)=>value(b.code)-value(a.code)).slice(0,7).map(i=>value(i.code)),backgroundColor:'#2878b9',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}
function stockPage(){ $('stock').innerHTML=`<h2>رصيد المخزن الحالي — صنف بصنف</h2><div class="card"><div class="form">${inp('sq','بحث','','text')}<div class="field"><label>النوع</label><select id="st"><option value="">الكل</option><option value="raw">خام</option><option value="finished">منتج تام</option><option value="component">مكون</option><option value="other">أخرى</option></select></div><button class="btn success" onclick="drawStock()">تطبيق</button><button class="btn light" onclick="exportStock()">Excel</button></div><div id="stockOut"></div></div>`;drawStock()}
function drawStock(){let q=($('sq')?.value||'').toLowerCase(),t=$('st')?.value||'',a=S.items.filter(i=>(!q||(i.code+' '+i.name).toLowerCase().includes(q))&&(!t||i.type===t));$('stockOut').innerHTML=`<div class="table"><table><thead><tr><th>الكود</th><th>الصنف</th><th>النوع</th><th>الوحدة</th><th>افتتاحي</th><th>وارد</th><th>منصرف</th><th>الرصيد</th><th>القيمة</th></tr></thead><tbody>${a.map(i=>{let ins=S.moves.filter(m=>m.code===i.code&&m.status!=='cancelled'&&sign(m.type)>0).reduce((x,m)=>x+N(m.qty),0),out=S.moves.filter(m=>m.code===i.code&&m.status!=='cancelled'&&sign(m.type)<0).reduce((x,m)=>x+N(m.qty),0);return `<tr><td>${E(i.code)}</td><td>${E(i.name)}</td><td>${type(i.type)}</td><td>${E(i.unit)}</td><td>${M(i.opening)}</td><td>${M(ins)}</td><td>${M(out)}</td><td><b>${M(stock(i.code))}</b></td><td>${M(value(i.code))}</td></tr>`}).join('')}</tbody></table></div>`}
function itemsPage(){ $('items').innerHTML=`<h2>دليل الأصناف والأكواد</h2><div class="card"><button class="btn success" onclick="itemForm()">+ إضافة صنف</button><div id="itemsOut" style="margin-top:10px"></div></div>`;drawItems()}function drawItems(){let a=S.items;$('itemsOut').innerHTML=a.length?`<div class="table"><table><thead><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>الوحدة</th><th>الرصيد</th><th>تكلفة</th><th>NRV</th><th>إجراء</th></tr></thead><tbody>${a.map(i=>`<tr><td>${E(i.code)}</td><td>${E(i.name)}</td><td>${type(i.type)}</td><td>${E(i.unit)}</td><td>${M(stock(i.code))}</td><td>${M(i.unitCost)}</td><td>${nrv(i.code)===null?'غير مهيأ':M(nrv(i.code))}</td><td><button class="btn light" onclick="itemForm('${E(i.code)}')">تعديل</button> <button class="btn danger" onclick="delItem('${E(i.code)}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد أصناف.</div>'}
function itemForm(c=''){let i=it(c)||{code:'',name:'',type:'raw',unit:'قطعة',opening:0,unitCost:0,sellPrice:0,completionCost:0,sellingCost:0,costMethod:'weighted'};$('items').innerHTML=`<h2>${c?'تعديل الصنف':'إضافة صنف'}</h2><div class="card"><div class="form">${inp('ic','الكود',i.code)}${inp('in','اسم الصنف',i.name)}<div class="field"><label>النوع</label><select id="ity"><option value="raw">خام</option><option value="finished">منتج تام</option><option value="component">مكون</option><option value="other">أخرى</option></select></div>${inp('iu','الوحدة',i.unit)}${inp('io','الرصيد الافتتاحي',i.opening,'number')}${inp('uc','تكلفة الوحدة',i.unitCost,'number')}${inp('sp','سعر البيع التقديري',i.sellPrice,'number')}<div class="field"><label>طريقة التكلفة</label><select id="cm"><option value="weighted">متوسط مرجح</option><option value="fifo">FIFO</option><option value="specific">تحديد محدد</option></select></div>${inp('cc','تكلفة الإكمال',i.completionCost,'number')}${inp('sc','تكاليف البيع اللازمة',i.sellingCost,'number')}<div class="field full"><div class="note">إذا لم يوجد سعر بيع تقديري صالح، يظهر NRV كـ «غير مهيأ» ولا يتم افتراض NRV = صفر.</div></div><div class="actions full"><button class="btn success" onclick="saveItem('${E(c)}')">حفظ</button><button class="btn light" onclick="itemsPage()">إلغاء</button></div></div></div>`;$('ity').value=i.type;$('cm').value=i.costMethod}
function saveItem(old){let o={code:$('ic').value.trim(),name:$('in').value.trim(),type:$('ity').value,unit:$('iu').value.trim(),opening:N($('io').value),unitCost:N($('uc').value),sellPrice:N($('sp').value),costMethod:$('cm').value,completionCost:N($('cc').value),sellingCost:N($('sc').value)};if(!o.code||!o.name)return alert('أدخل الكود والاسم');if(old&&old!==o.code&&S.moves.some(m=>m.code===old))return alert('لا يمكن تغيير كود مرتبط بحركات');let ix=S.items.findIndex(x=>x.code===(old||o.code));if(ix>=0)S.items[ix]=o;else if(it(o.code))return alert('الكود موجود بالفعل');else S.items.push(o);save();itemsPage()}
function delItem(c){if(S.moves.some(m=>m.code===c)||S.families.some(f=>f.components.some(x=>x.code===c)))return alert('لا يمكن حذف صنف مرتبط');if(confirm('حذف الصنف؟')){S.items=S.items.filter(i=>i.code!==c);save();drawItems()}}
function familiesPage(){ $('families').innerHTML=`<h2>العائلات وقدرة التجميع</h2><div class="card"><button class="btn success" onclick="famForm()">+ عائلة</button><div id="famOut" style="margin-top:10px"></div></div>`;drawFam()}function drawFam(){ $('famOut').innerHTML=S.families.length?`<div class="table"><table><thead><tr><th>الكود</th><th>العائلة</th><th>المكونات</th><th>القدرة</th><th>إجراء</th></tr></thead><tbody>${S.families.map(f=>{let v=f.components.map(c=>Math.floor(stock(c.code)/Math.max(1,N(c.qty)))),cap=v.length?Math.max(0,Math.min(...v)):0;return `<tr><td>${E(f.code)}</td><td>${E(f.name)}</td><td>${f.components.map(c=>E(c.code)+' × '+c.qty).join(' | ')}</td><td>${M(cap)}</td><td><button class="btn light" onclick="famForm('${f.id}')">تعديل</button> <button class="btn danger" onclick="delFam('${f.id}')">حذف</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد عائلات.</div>'}
function famForm(id=''){let f=S.families.find(x=>x.id===id)||{id:'',code:'',name:'',components:[]};$('families').innerHTML=`<h2>${id?'تعديل العائلة':'إضافة عائلة'}</h2><div class="card"><div class="form">${inp('fc','كود العائلة',f.code)}${inp('fn','اسم العائلة',f.name)}<div class="full"><b>المكونات</b><div id="comps"></div><button class="btn light" onclick="addComp()">+ مكون</button></div><div class="actions full"><button class="btn success" onclick="saveFam('${id}')">حفظ</button><button class="btn light" onclick="familiesPage()">إلغاء</button></div></div></div>`;f.components.forEach(addComp);if(!f.components.length)addComp()}
function addComp(c={code:'',qty:1}){$('comps').insertAdjacentHTML('beforeend',`<div class="comp">${sel('x'+ID(''),c.code)}<input class="cq" type="number" min=".0001" value="${c.qty}"><button class="btn danger" onclick="this.parentElement.remove()">حذف</button></div>`)}function saveFam(id){let f=S.families.find(x=>x.id===id),comps=[...document.querySelectorAll('.comp')].map(r=>({code:r.querySelector('select').value,qty:N(r.querySelector('.cq').value)})).filter(x=>x.code&&x.qty>0);if(!$('fc').value.trim()||!$('fn').value.trim()||!comps.length)return alert('أكمل بيانات العائلة');if(new Set(comps.map(x=>x.code)).size!==comps.length)return alert('لا تكرر نفس المكون داخل العائلة');let o={id:id||ID('F'),code:$('fc').value.trim(),name:$('fn').value.trim(),components:comps};if(f)Object.assign(f,o);else S.families.push(o);save();familiesPage()}function delFam(id){if(confirm('حذف العائلة؟')){S.families=S.families.filter(f=>f.id!==id);save();drawFam()}}
function movesPage(){ $('moves').innerHTML=`<h2>حركة المخزون</h2><div class="card"><button class="btn success" onclick="moveForm()">+ تسجيل حركة</button><div class="form">${inp('mf','من تاريخ','','date')}${inp('mt','إلى تاريخ',D(),'date')}<div class="field"><label>الصنف</label>${sel('mi')}</div><button class="btn light" onclick="drawMoves()">تطبيق</button></div><div id="movesOut"></div></div>`;drawMoves()}
function moveForm(){ $('moves').innerHTML=`<h2>تسجيل حركة</h2><div class="card"><div class="form">${inp('md','التاريخ',D(),'date')}${inp('mtime','الوقت',new Date().toTimeString().slice(0,5),'time')}<div class="field"><label>الصنف</label>${sel('mc')}</div><div class="field"><label>نوع الحركة</label><select id="mk"><option value="purchase">استلام شراء</option><option value="production">استلام إنتاج</option><option value="issue">صرف طلبية/إنتاج</option><option value="return">مرتجع عميل</option><option value="supplierReturn">مرتجع للمورد</option><option value="transferOut">تحويل صادر</option><option value="transferIn">تحويل وارد</option><option value="adjustmentIn">تسوية زيادة</option><option value="adjustmentOut">تسوية نقص</option></select></div>${inp('mq','الكمية',1,'number')}${inp('muc','تكلفة الوحدة للحركة',0,'number')}${inp('mr','رقم/مرجع المستند')}${inp('ms','المورد/الجهة')}${inp('mrec','المستلم/طالب الصرف')}${inp('mshift','الوردية','نهار')}<div class="field full">${'<label>ملاحظات</label><textarea id="mn"></textarea>'}</div><div class="note field full">تكلفة الحركة تُحفظ الآن كسجل تشغيلي؛ محرك FIFO/المتوسط المرجح الفعلي لم يُنفذ بعد، والقيمة الحالية تعتمد تكلفة بطاقة الصنف.</div><div class="actions full"><button class="btn success" onclick="saveMove()">حفظ</button><button class="btn light" onclick="movesPage()">إلغاء</button></div></div></div>`}
function saveMove(){let m={id:ID('M'),date:$('md').value,time:$('mtime').value,code:$('mc').value,type:$('mk').value,qty:N($('mq').value),unitCost:N($('muc').value),ref:$('mr').value,supplier:$('ms').value,receiver:$('mrec').value,shift:$('mshift').value,note:$('mn').value,status:'active'};if(!m.date||!m.code||m.qty<=0)return alert('أكمل البيانات');S.moves.push(m);save();movesPage()}
function drawMoves(){let f=$('mf')?.value||'',t=$('mt')?.value||'9999-99-99',c=$('mi')?.value||'',a=S.moves.filter(m=>m.date>=f&&m.date<=t&&(!c||m.code===c)).sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));$('movesOut').innerHTML=a.length?`<div class="table"><table><thead><tr><th>التاريخ</th><th>الوقت</th><th>الكود</th><th>الصنف</th><th>الحركة</th><th>الكمية</th><th>تكلفة الحركة</th><th>المرجع</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${a.map(m=>`<tr><td>${m.date}</td><td>${E(m.time||'')}</td><td>${E(m.code)}</td><td>${E(it(m.code)?.name)}</td><td>${mn(m.type)}</td><td>${M(m.qty)}</td><td>${m.unitCost?M(m.unitCost):'—'}</td><td>${E(m.ref||'')}</td><td>${m.status==='cancelled'?'<span class="pill red">ملغاة</span>':'<span class="pill green">فعالة</span>'}</td><td>${m.status==='cancelled'?'—':`<button class="btn danger" onclick="cancelMove('${m.id}')">إلغاء</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد حركات.</div>'}function cancelMove(id){let m=S.moves.find(x=>x.id===id);if(m&&confirm('إلغاء الحركة؟ ستبقى محفوظة للمراجعة.')){m.status='cancelled';m.cancelledAt=new Date().toISOString();save();movesPage()}}
function countsPage(){ $('counts').innerHTML=`<h2>الجرد الفعلي والانحراف</h2><div class="card"><button class="btn success" onclick="countForm()">+ إدخال جرد</button><div class="form">${inp('cf','تاريخ الجرد',D(),'date')}<div class="field"><label>الصنف</label>${sel('ci')}</div><button class="btn light" onclick="drawCounts()">تطبيق</button></div><div class="note">الانحراف = الجرد الفعلي − الرصيد الدفتري. الإشارة مهمة: السالب نقص، والموجب زيادة. الجرد لا يغير الرصيد تلقائيًا.</div><div id="countsOut"></div></div>`;drawCounts()}
function countForm(){ $('counts').innerHTML=`<h2>إدخال جرد</h2><div class="card"><div class="form">${inp('cd','تاريخ الجرد',D(),'date')}${inp('cno','رقم محضر الجرد',ID('C').toUpperCase())}${inp('cw','المخزن/الموقع')}${inp('ccn','القائم بالجرد')}<div class="field"><label>الصنف</label>${sel('citem')}</div>${inp('cqty','الكمية الفعلية',0,'number')}${inp('creason','سبب الجرد','دوري')}${inp('cnote','ملاحظات')}<div class="actions full"><button class="btn success" onclick="saveCount()">حفظ</button></div></div></div>`}
function saveCount(){let x={id:ID('C'),date:$('cd').value,countNo:$('cno').value,warehouse:$('cw').value,counter:$('ccn').value,code:$('citem').value,qty:N($('cqty').value),reason:$('creason').value,note:$('cnote').value};if(!x.date||!x.code||x.qty<0)return alert('أكمل البيانات');let z=S.counts.findIndex(c=>c.date===x.date&&c.code===x.code);if(z>=0)S.counts[z]={...S.counts[z],...x};else S.counts.push(x);save();countsPage()}
function drawCounts(){let d=$('cf')?.value||D(),c=$('ci')?.value||'',a=S.items.filter(i=>!c||i.code===c);$('countsOut').innerHTML=`<div class="table"><table><thead><tr><th>الكود</th><th>الصنف</th><th>دفترى</th><th>فعلى</th><th>الانحراف</th><th>قيمة الانحراف</th><th>الحالة</th></tr></thead><tbody>${a.map(i=>{let x=S.counts.find(c=>c.date===d&&c.code===i.code),b=stock(i.code,d),dev=x?x.qty-b:null;return `<tr><td>${E(i.code)}</td><td>${E(i.name)}</td><td>${M(b)}</td><td>${x?M(x.qty):'—'}</td><td>${dev===null?'—':M(dev)}</td><td>${dev===null?'—':M(dev*cost(i.code))}</td><td>${dev===null?'لم يُجرد':dev===0?'مطابق':dev<0?'نقص':'زيادة'}</td></tr>`}).join('')}</tbody></table></div>`}
function plansPage(){ $('plans').innerHTML=`<h2>الخطط والاستهلاك</h2><div class="card"><button class="btn success" onclick="planForm()">+ خطة</button><div id="plansOut"></div></div>`;drawPlans()}function planForm(){ $('plans').innerHTML=`<h2>إضافة خطة</h2><div class="card"><div class="form">${inp('pf','من',D(),'date')}${inp('pt','إلى',D(),'date')}<div class="field"><label>الصنف</label>${sel('pc')}</div>${inp('pq','الكمية المخططة',0,'number')}<div class="actions full"><button class="btn success" onclick="savePlan()">حفظ</button></div></div></div>`}function savePlan(){let p={id:ID('P'),from:$('pf').value,to:$('pt').value,code:$('pc').value,qty:N($('pq').value)};if(!p.code||p.qty<0)return alert('أكمل البيانات');S.plans.push(p);save();plansPage()}function drawPlans(){let a=S.plans;$('plansOut').innerHTML=a.length?`<div class="table"><table><thead><tr><th>الفترة</th><th>الصنف</th><th>المخطط</th><th>الاستهلاك</th><th>الفرق</th><th>% التنفيذ</th></tr></thead><tbody>${a.map(p=>{let ac=S.moves.filter(m=>m.status!=='cancelled'&&m.type==='issue'&&m.code===p.code&&m.date>=p.from&&m.date<=p.to).reduce((x,m)=>x+N(m.qty),0),pc=p.qty?ac/p.qty*100:0;return `<tr><td>${p.from} → ${p.to}</td><td>${E(it(p.code)?.name)}</td><td>${M(p.qty)}</td><td>${M(ac)}</td><td>${M(ac-p.qty)}</td><td>${pc.toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد خطط.</div>'}
function analysisPage(){ $('analysis').innerHTML=`<h2>تحليل المخزون</h2><div class="card"><div class="form"><div class="field"><label>التقرير</label><select id="at"><option value="all">ملخص المخزون</option><option value="raw">الخامات</option><option value="finished">المنتجات التامة</option><option value="family">العائلات وقدرة التجميع</option><option value="variance">الجرد والانحراف</option><option value="period">الخطة مقابل الاستهلاك</option><option value="ias2">IAS 2 — التكلفة مقابل NRV</option></select></div>${inp('ad','حتى تاريخ',D(),'date')}${inp('aq','بحث')}<button class="btn primary" onclick="drawAnalysis()">توليد</button><button class="btn success" onclick="exportAnalysis()">Excel</button><label class="btn light">استيراد Excel<input id="imp" type="file" accept=".xlsx,.xls,.csv,.json" hidden onchange="importExcel(this)"></label></div><div class="note">تحليل IAS 2 هنا تشغيلي: لا يتم إنشاء قيود محاسبية. NRV = سعر البيع التقديري − تكاليف الإكمال − تكاليف البيع اللازمة. إذا لم يوجد سعر بيع صالح فلا يتم افتراض NRV = صفر.</div><div id="analysisOut"></div></div>`;drawAnalysis()}
function drawAnalysis(){let t=$('at').value,d=$('ad').value||D(),q=($('aq').value||'').toLowerCase(),o=$('analysisOut');if(t==='family'){o.innerHTML=familyReport(d,q);return}if(t==='variance'){o.innerHTML=varianceReport(d,q);return}if(t==='period'){o.innerHTML=periodReport(q);return}let a=S.items.filter(i=>(!q||(i.code+' '+i.name).toLowerCase().includes(q))&&(!['raw','finished'].includes(t)||i.type===t));o.innerHTML=report(a,d,t)}function report(a,d,t){let v=a.reduce((x,i)=>x+value(i.code,d),0),l=a.reduce((x,i)=>x+lower(i.code,d),0),w=a.reduce((x,i)=>x+wd(i.code,d),0);return `<div class="grid">${k('عدد الأصناف',a.length)}${k('قيمة التكلفة',M(v))}${k('القيمة المستخدمة',M(l))}${k('خفض محتمل',M(w))}</div><div class="table"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد</th><th>التكلفة</th><th>قيمة التكلفة</th><th>NRV</th><th>القيمة المستخدمة</th><th>خفض محتمل</th></tr></thead><tbody>${a.map(i=>`<tr><td>${E(i.code)}</td><td>${E(i.name)}</td><td>${M(stock(i.code,d))}</td><td>${M(cost(i.code))}</td><td>${M(value(i.code,d))}</td><td>${nrv(i.code)===null?'غير مهيأ':M(nrv(i.code))}</td><td>${M(lower(i.code,d))}</td><td>${M(wd(i.code,d))}</td></tr>`).join('')}</tbody></table></div>`}
function familyReport(d,q){let a=S.families.filter(f=>(f.code+' '+f.name).toLowerCase().includes(q));return `<div class="table"><table><thead><tr><th>العائلة</th><th>المكونات</th><th>قدرة التجميع</th><th>المحدد</th></tr></thead><tbody>${a.map(f=>{let z=f.components.map(c=>({c,cap:Math.floor(stock(c.code,d)/Math.max(1,N(c.qty)))})),cap=z.length?Math.max(0,Math.min(...z.map(x=>x.cap))):0,lim=z.find(x=>x.cap===cap);return `<tr><td>${E(f.name)}</td><td>${z.map(x=>E(it(x.c.code)?.name)+' × '+x.c.qty).join('<br>')}</td><td>${M(cap)}</td><td>${lim?E(it(lim.c.code)?.name):'—'}</td></tr>`}).join('')}</tbody></table></div>`}function varianceReport(d,q){let a=S.items.filter(i=>(i.code+' '+i.name).toLowerCase().includes(q));return `<div class="table"><table><thead><tr><th>الصنف</th><th>دفترى</th><th>فعلى</th><th>الانحراف</th><th>القيمة</th></tr></thead><tbody>${a.map(i=>{let x=S.counts.find(c=>c.date===d&&c.code===i.code),b=stock(i.code,d),v=x?x.qty-b:null;return `<tr><td>${E(i.name)}</td><td>${M(b)}</td><td>${x?M(x.qty):'—'}</td><td>${v===null?'—':M(v)}</td><td>${v===null?'—':M(v*cost(i.code))}</td></tr>`}).join('')}</tbody></table></div>`}function periodReport(q){return `<div class="table"><table><thead><tr><th>الفترة</th><th>الصنف</th><th>المخطط</th><th>الفعلية</th><th>الفرق</th><th>%</th></tr></thead><tbody>${S.plans.filter(p=>(it(p.code)?.name+' '+p.code).toLowerCase().includes(q)).map(p=>{let a=S.moves.filter(m=>m.status!=='cancelled'&&m.type==='issue'&&m.code===p.code&&m.date>=p.from&&m.date<=p.to).reduce((x,m)=>x+N(m.qty),0);return `<tr><td>${p.from} → ${p.to}</td><td>${E(it(p.code)?.name)}</td><td>${M(p.qty)}</td><td>${M(a)}</td><td>${M(a-p.qty)}</td><td>${p.qty?(a/p.qty*100).toFixed(1):'0.0'}%</td></tr>`}).join('')}</tbody></table></div>`}
function exportStock(){let rows=S.items.map(i=>({الكود:i.code,الصنف:i.name,النوع:type(i.type),الوحدة:i.unit,الرصيد_الافتتاحي:i.opening,الرصيد_الحالي:stock(i.code),تكلفة_الوحدة:i.unitCost,قيمة_المخزون:value(i.code)}));downloadX(rows,'I_lock_Current_Stock.xlsx','الرصيد')}
function exportAnalysis(){let t=$('at').value,d=$('ad').value||D(),rows=t==='family'?S.families.map(f=>({كود_العائلة:f.code,العائلة:f.name,قدرة_التجميع:f.components.length?Math.max(0,Math.min(...f.components.map(c=>Math.floor(stock(c.code,d)/Math.max(1,N(c.qty)))))):0})) : S.items.map(i=>({الكود:i.code,الصنف:i.name,النوع:type(i.type),الرصيد:stock(i.code,d),التكلفة:cost(i.code),قيمة_التكلفة:value(i.code,d),NRV:nrv(i.code)===null?'غير مهيأ':nrv(i.code),القيمة_المستخدمة:lower(i.code,d),خفض_محتمل:wd(i.code,d)}));downloadX(rows,'I_lock_Inventory_Analysis.xlsx','Analysis')}
function downloadX(rows,file,sheet){if(!window.XLSX)return alert('أداة Excel غير متاحة؛ تحقق من الإنترنت');let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows),sheet);XLSX.writeFile(w,file)}
async function importExcel(input){let f=input.files[0];if(!f)return;try{let rows;if(f.name.endsWith('.json'))rows=JSON.parse(await f.text());else{let b=await f.arrayBuffer(),w=XLSX.read(b,{type:'array'});rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''})}let add=0,upd=0;rows.forEach(r=>{let c=String(r.الكود||r.code||r['كود الصنف']||'').trim(),name=String(r.الصنف||r.name||r['اسم الصنف']||'').trim();if(!c||!name)return;let i=it(c),o={code:c,name,type:(r.النوع==='خام'||r.type==='raw')?'raw':(r.النوع==='منتج تام'||r.type==='finished')?'finished':(r.النوع==='مكون'||r.type==='component')?'component':'other',unit:String(r.الوحدة||r.unit||'قطعة'),opening:N(r.الرصيد_الافتتاحي??r.الرصيد??r.opening),unitCost:N(r.تكلفة_الوحدة??r.unitCost),sellPrice:N(r.سعر_البيع??r.sellPrice),completionCost:N(r.تكلفة_الإكمال??r.completionCost),sellingCost:N(r.تكاليف_البيع??r.sellingCost),costMethod:r.طريقة_التكلفة||r.costMethod||'weighted'};if(i){Object.assign(i,o);upd++}else{S.items.push(o);add++}});save();alert('تم الاستيراد — إضافة: '+add+' | تحديث: '+upd);analysisPage()}catch(e){alert('تعذر قراءة الملف: '+e.message)}input.value=''}
function dataPage(){ $('data').innerHTML=`<h2>البيانات والنسخ الاحتياطي</h2><div class="grid2"><div class="card"><h3>Backup</h3><button class="btn success" onclick="backup()">تصدير JSON</button><label class="btn light">استعادة JSON<input type="file" accept=".json" hidden onchange="restore(this)"></label></div><div class="card"><h3>بيانات تجريبية</h3><button class="btn warning" onclick="demo()">تحميل Demo</button><button class="btn danger" onclick="clearData()">مسح البيانات</button></div></div><div class="note">Checkpoint: الأصناف + الرصيد + الحركات + العائلات + قدرة التجميع + الجرد والانحراف + الخطط والاستهلاك + تحليل IAS 2/NRV + Excel + Backup.</div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='I_lock_backup.json';a.click()}async function restore(i){let f=i.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.items||!x.moves)throw Error('ملف غير صالح');Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,x);save();location.reload()}catch(e){alert(e.message)}}function clearData(){if(confirm('تأكد من وجود Backup ثم احذف البيانات؟')){localStorage.removeItem(KEY);location.reload()}}
function demo(){if(!confirm('سيتم استبدال البيانات الحالية؟'))return;Object.assign(S,{items:[{code:'RM001',name:'خام بلاستيك A',type:'raw',unit:'كجم',opening:500,unitCost:80,sellPrice:0,completionCost:0,sellingCost:0,costMethod:'weighted'},{code:'P001',name:'جسم فيشة دكر',type:'component',unit:'قطعة',opening:1000,unitCost:2.2,sellPrice:0,completionCost:0,sellingCost:0,costMethod:'weighted'},{code:'P002',name:'قلب فيشة دكر',type:'component',unit:'قطعة',opening:900,unitCost:1.8,sellPrice:0,completionCost:0,sellingCost:0,costMethod:'weighted'},{code:'P003',name:'غطاء فيشة دكر',type:'component',unit:'قطعة',opening:1200,unitCost:1.2,sellPrice:0,completionCost:0,sellingCost:0,costMethod:'weighted'},{code:'F001',name:'فيشة دكر كاملة',type:'finished',unit:'قطعة',opening:200,unitCost:7,sellPrice:9,completionCost:.3,sellingCost:.2,costMethod:'weighted'}],families:[{id:'F1',code:'FAM001',name:'فيشة دكر',components:[{code:'P001',qty:1},{code:'P002',qty:1},{code:'P003',qty:1}]}],moves:[{id:'m1',date:D(),time:'08:00',code:'RM001',type:'issue',qty:70,status:'active'},{id:'m2',date:D(),time:'09:00',code:'P001',type:'production',qty:300,status:'active'},{id:'m3',date:D(),time:'09:00',code:'P002',type:'production',qty:250,status:'active'},{id:'m4',date:D(),time:'09:00',code:'P003',type:'production',qty:500,status:'active'}],counts:[],plans:[{id:'p1',from:D(),to:D(),code:'RM001',qty:60}]});save();location.reload()}
nav();render('dashboard');
</script></body></html>
