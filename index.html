<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I lock | إدارة المخزون | مصنع الحقن</title>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>:root{--nav:#0b1f33;--nav2:#123a55;--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#687582;--line:#dfe6ec;--green:#17834b;--red:#c43d3d;--amber:#b77a00;--blue:#2468a6;--shadow:0 8px 25px #102b3d12}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:22px 26px;box-shadow:var(--shadow)}.brand{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0;font-size:26px}.brand .sub{opacity:.85;margin-top:5px;font-size:14px}.badge{background:#ffffff18;border:1px solid #ffffff2e;border-radius:10px;padding:9px 13px;font-size:12px}nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}nav button{border:0;background:#edf2f6;color:#34424e;border-radius:9px;padding:10px 13px;white-space:nowrap;cursor:pointer;font-weight:700}nav button.active{background:var(--nav);color:#fff}main{max-width:1500px;margin:auto;padding:20px}.tab{display:none}.tab.active{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field.wide{min-width:240px;flex:1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}button{font-family:inherit}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--nav);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.light{background:#edf2f6;color:#263746}.warning{background:#fff2d1;color:#805800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:28px;font-weight:800;margin-top:7px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:5px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-title h2{font-size:18px;margin:0}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}.table th{background:#f0f4f7;position:sticky;top:0;z-index:1}.table tr:hover td{background:#fafcfd}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.pill.green{background:#e4f5ec;color:#12683d}.pill.red{background:#fde8e8;color:#9d2929}.pill.amber{background:#fff2d1;color:#805800}.pill.blue{background:#e4f0fb;color:#1f5d91}.muted{color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}.note{padding:12px;border-radius:10px;background:#eef5fb;border-right:4px solid var(--blue);font-size:12px;line-height:1.8}.alert{padding:12px;border-radius:10px;background:#fff5e0;border-right:4px solid var(--amber);font-size:12px;line-height:1.8}.danger-note{padding:12px;border-radius:10px;background:#fff0f0;border-right:4px solid var(--red);font-size:12px;line-height:1.8}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form-grid .full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:11px}.chartbox{height:300px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:30px}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:12px}.grid,.grid2,.form-grid{grid-template-columns:1fr}.brand{align-items:flex-start;flex-direction:column}.field,.field.wide{min-width:100%}}</style>
</head>
<body>
<header><div class="brand"><div><h1>I lock</h1><div class="sub">إدارة المخزون</div><div class="sub">مصنع الحقن</div></div><div class="badge">نظام رقابة وتحليل المخزون — GitHub Edition</div></div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="tab active"></section>
<section id="stockSummary" class="tab"></section>
<section id="items" class="tab"></section>
<section id="families" class="tab"></section>
<section id="moves" class="tab"></section>
<section id="counts" class="tab"></section>
<section id="plans" class="tab"></section>
<section id="analysis" class="tab"></section>
<section id="data" class="tab"></section>
</main>
<div class="footer">I lock — إدارة المخزون — مصنع الحقن | تحليل المخزون — نسخة 2 | البيانات المحلية محفوظة على هذا المتصفح</div>

<script>
const KEY='ilock_inventory_v3';
const tabs=[['dashboard','لوحة الإدارة'],['stockSummary','رصيد المخزن الحالي'],['items','الأصناف والأكواد'],['families','العائلات والتجميع'],['moves','حركة المخزون'],['counts','الجرد والانحراف'],['plans','الخطط والاستهلاك'],['analysis','تحليل المخزون'],['data','البيانات والنسخ الاحتياطي']];
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{items:[],families:[],components:[],moves:[],counts:[],plans:[],settings:{}};
let charts={};
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const n=x=>Number(x)||0;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=x=>n(x).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function el(id){return document.getElementById(id)}
function item(code){return state.items.find(x=>x.code===code)}
function movementSign(type){return ['purchase','return','transferIn','production'].includes(type)?1:-1}
function moveQty(m){return n(m.qty)*movementSign(m.type)}
function stock(code,asOf=today()){let s=n(item(code)?.opening);state.moves.filter(m=>m.code===code&&m.date<=asOf).sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>s+=moveQty(m));return s}
function cost(code){return n(item(code)?.unitCost)}
function nr(code){let i=item(code);if(!i)return 0;let selling=n(i.sellPrice),complete=n(i.completionCost),sellCost=n(i.sellingCost);return Math.max(0,selling-complete-sellCost)}
function carrying(code,asOf=today()){return Math.max(0,stock(code,asOf))*cost(code)}
function lowerValue(code,asOf=today()){return Math.min(carrying(code,asOf),Math.max(0,stock(code,asOf))*nr(code))}
function writeDown(code,asOf=today()){return Math.max(0,carrying(code,asOf)-lowerValue(code,asOf))}
function familyStock(fid,asOf=today()){let f=state.families.find(x=>x.id===fid);if(!f)return 0;let vals=f.components.map(c=>Math.floor(stock(c.code,asOf)/Math.max(1,n(c.qty))));return vals.length?Math.max(0,Math.min(...vals)):0}
function fmtDate(x){return x||''}

function selectItems(name='code',value='',filter=''){
 let arr=state.items.filter(i=>!filter||i.type===filter);
 return `<select id="${name}"><option value="">اختر الصنف</option>${arr.map(i=>`<option value="${esc(i.code)}" ${i.code===value?'selected':''}>${esc(i.code)} —${esc(i.name)}</option>`).join('')}</select>`
}

function nav(){
 el('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t[0]}" class="${i===0?'active':''}">${t[1]}</button>`).join('');
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab))
}

function show(id){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 el(id).classList.add('active');
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));
 render(id)
}

function render(id){
 ({dashboard:renderDashboard,stockSummary:renderStockSummary,items:renderItems,families:renderFamilies,moves:renderMoves,counts:renderCounts,plans:renderPlans,analysis:renderAnalysis,data:renderData}[id])()
}

function renderDashboard(){
 let totalQty=state.items.reduce((a,i)=>a+Math.max(0,stock(i.code)),0),
 value=state.items.reduce((a,i)=>a+carrying(i.code),0),
 wd=state.items.reduce((a,i)=>a+writeDown(i.code),0),
 negative=state.items.filter(i=>stock(i.code)<0).length;
 let raw=state.items.filter(i=>i.type==='raw').length,
 fin=state.items.filter(i=>i.type==='finished').length;

 el('dashboard').innerHTML=`
 <div class="section-title"><h2>لوحة الإدارة الرئيسية</h2><span class="muted small">حتى تاريخ ${today()}</span></div>
 <div class="grid">
 ${kpi('عدد الأصناف',state.items.length,'Raw '+raw+' | Finished '+fin)}
 ${kpi('إجمالي الكميات',money(totalQty),'رصيد تقديري من سجل الحركة')}
 ${kpi('قيمة التكلفة',money(value),'Inventory carrying amount قبل اختبار NRV')}
 ${kpi('خفض محتمل',money(wd),'Lower of cost and NRV — IAS 2')}
 </div>

 <div class="grid2" style="margin-top:14px">
 <div class="card">
 <div class="section-title"><h2>حالة الرقابة</h2></div>
 <div class="note">النظام يربط بين الرصيد، الحركة، الجرد الفعلي، الخطة، استهلاك الإنتاج، العائلات، وقدرة التجميع. القيم المحاسبية هنا أداة تحليل وليست قيدًا محاسبيًا تلقائيًا.</div>
 <div style="margin-top:12px">${negative?`<div class="danger-note">يوجد ${negative} صنف برصيد سالب. يجب مراجعة الحركات أو الأرصدة الافتتاحية.</div>`:'<div class="note">لا توجد أرصدة سالبة حاليًا.</div>'}</div>
 </div>

 <div class="card">
 <div class="section-title"><h2>توزيع قيمة المخزون</h2></div>
 <div class="chartbox"><canvas id="valueChart"></canvas></div>
 </div>
 </div>

 <div class="grid2" style="margin-top:14px">
 <div class="card">
 <div class="section-title"><h2>رصيد المخزن الحالي</h2><button class="btn primary" onclick="show('stockSummary')">فتح كشف الرصيد</button></div>
 <div class="note">عرض تفصيلي لكل صنف: رصيد أول المدة، الوارد، المنصرف، والرصيد الحالي، مع الوحدة ونوع الصنف، وجميعها محسوبة من سجل الأصناف وسجل الحركات.</div>
 </div>

 <div class="card">
 <div class="section-title"><h2>أصناف تحتاج مراجعة</h2><button class="btn light" onclick="show('analysis')">فتح التحليل</button></div>
 ${dashboardAlerts()}
 </div>
 </div>`;

 setTimeout(()=>drawValueChart(),0)
}

function kpi(a,b,c){
 return `<div class="card kpi"><div class="label">${a}</div><div class="value">${esc(b)}</div><div class="hint">${c}</div></div>`
}

function dashboardAlerts(){
 let rows=state.items.map(i=>({i,s:stock(i.code),wd:writeDown(i.code)})).filter(x=>x.s<0||x.wd>0).sort((a,b)=>b.wd-a.wd).slice(0,12);
 if(!rows.length)return '<div class="empty">لا توجد حالات تحتاج مراجعة وفق البيانات الحالية.</div>';
 return `<div class="table-wrap"><table class="table"><thead><tr><th>الكود</th><th>الصنف</th><th>النوع</th><th>الرصيد</th><th>التكلفة</th><th>NRV</th><th>خفض محتمل</th><th>الحالة</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.i.code)}</td><td>${esc(x.i.name)}</td><td>${typeName(x.i.type)}</td><td>${money(x.s)}</td><td>${money(cost(x.i.code))}</td><td>${money(nr(x.i.code))}</td><td>${money(x.wd)}</td><td>${x.s<0?'<span class="pill red">رصيد سالب</span>':'<span class="pill amber">اختبار NRV</span>'}</td></tr>`).join('')}</tbody></table></div>`
}

function drawValueChart(){
 if(charts.value)charts.value.destroy();
 let r=state.items.filter(i=>stock(i.code)>0).sort((a,b)=>carrying(b.code)-carrying(a.code)).slice(0,8);
 let c=document.getElementById('valueChart');
 if(!c)return;
 if(!window.Chart){c.parentElement.innerHTML='<div class="empty">جاري تحميل الرسم البياني...</div>';return}
 charts.value=new Chart(c,{type:'bar',data:{labels:r.map(i=>i.name.slice(0,18)),datasets:[{label:'قيمة التكلفة',data:r.map(i=>carrying(i.code))},{label:'القيمة بعد Lower of Cost/NRV',data:r.map(i=>lowerValue(i.code))}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})
}

function typeName(t){return {raw:'خام',finished:'منتج تام',component:'مكون',other:'أخرى'}[t]||t||'—'}

function renderStockSummary(){
 el('stockSummary').innerHTML=`
 <div class="section-title">
 <div><h2>رصيد المخزن الحالي — صنف بصنف</h2><div class="muted small">الرصيد = رصيد أول المدة + الحركات الداخلة − الحركات الخارجة</div></div>
 <button class="btn success" onclick="exportCurrentStock()">تصدير Excel</button>
 </div>

 <div class="card">
 <div class="toolbar">
 <div class="field wide"><label>بحث</label><input id="ssSearch" placeholder="كود الصنف أو اسم الصنف"></div>

 <div class="field"><label>نوع الصنف</label>
 <select id="ssType">
 <option value="">الكل</option>
 <option value="raw">خام</option>
 <option value="finished">منتج تام</option>
 <option value="component">مكون</option>
 <option value="other">هالك / أخرى</option>
 </select>
 </div>

 <div class="field"><label>العائلة</label>
 <select id="ssFamily">
 <option value="">كل العائلات</option>
 ${state.families.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}
 </select>
 </div>

 <div class="field"><label>الوحدة</label>
 <select id="ssUnit">
 <option value="">كل الوحدات</option>
 ${[...new Set(state.items.map(i=>i.unit).filter(Boolean))].map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('')}
 </select>
 </div>

 <button class="btn light" onclick="drawStockSummary()">تطبيق الفلاتر</button>
 </div>

 <div class="note" style="margin-bottom:12px">
 <b>مرجع الرصيد:</b> رصيد أول المدة محفوظ لكل صنف داخل سجل الأصناف، ثم تُحتسب حركة الصنف من سجل الحركات حتى تاريخ اليوم.
 كل صنف يحتفظ بكوده ووحدته ونوعه ورصيد مستقلًا، والعائلة تستخدم هذه الأرصدة دون دمج الأصناف.
 </div>

 <div id="stockSummaryTable"></div>
 </div>`;

 ['ssSearch','ssType','ssFamily','ssUnit'].forEach(id=>el(id).addEventListener('input',drawStockSummary));
 drawStockSummary()
}

function stockFamilyIds(code){
 return state.families.filter(f=>f.components.some(c=>c.code===code)).map(f=>f.id)
}

function drawStockSummary(){
 const q=(el('ssSearch')?.value||'').toLowerCase(),
 type=el('ssType')?.value||'',
 fam=el('ssFamily')?.value||'',
 unit=el('ssUnit')?.value||'';

 const arr=state.items.filter(i=>
 (!q||(i.code+' '+i.name).toLowerCase().includes(q))&&
 (!type||i.type===type)&&
 (!unit||i.unit===unit)&&
 (!fam||stockFamilyIds(i.code).includes(fam))
 );

 const rows=arr.map(i=>{
 const incoming=state.moves.filter(m=>m.code===i.code&&m.date<=today()&&movementSign(m.type)>0).reduce((a,m)=>a+n(m.qty),0),
 outgoing=state.moves.filter(m=>m.code===i.code&&m.date<=today()&&movementSign(m.type)<0).reduce((a,m)=>a+n(m.qty),0),
 current=stock(i.code);
 const value=Math.max(0,current)*cost(i.code);
 return {i,incoming,outgoing,current,value};
 });

 const totalValue=rows.reduce((a,r)=>a+r.value,0);

 el('stockSummaryTable').innerHTML=`
 <div class="section-title">
 <h3>كشف الرصيد الحالي</h3>
 <span class="muted small">${rows.length} صنف | قيمة التكلفة: ${money(totalValue)}</span>
 </div>

 ${rows.length?`
 <div class="table-wrap">
 <table class="table">
 <thead><tr>
 <th>الكود</th>
 <th>اسم الصنف</th>
 <th>النوع</th>
 <th>الوحدة</th>
 <th>رصيد أول المدة</th>
 <th>إجمالي الوارد</th>
 <th>إجمالي المنصرف</th>
 <th>الرصيد الحالي</th>
 <th>قيمة الرصيد</th>
 </tr></thead>

 <tbody>
 ${rows.map(r=>`
 <tr>
 <td>${esc(r.i.code)}</td>
 <td>${esc(r.i.name)}</td>
 <td>${typeName(r.i.type)}</td>
 <td>${esc(r.i.unit)}</td>
 <td>${money(r.i.opening)}</td>
 <td>${money(r.incoming)}</td>
 <td>${money(r.outgoing)}</td>
 <td><b>${money(r.current)}</b></td>
 <td>${money(r.value)}</td>
 </tr>`).join('')}
 </tbody>

 <tfoot><tr>
 <th colspan="4">الإجمالي</th>
 <th>${money(rows.reduce((a,r)=>a+n(r.i.opening),0))}</th>
 <th>${money(rows.reduce((a,r)=>a+r.incoming,0))}</th>
 <th>${money(rows.reduce((a,r)=>a+r.outgoing,0))}</th>
 <th>${money(rows.reduce((a,r)=>a+r.current,0))}</th>
 <th>${money(totalValue)}</th>
 </tr></tfoot>
 </table>
 </div>`:'<div class="empty">لا توجد أصناف مطابقة للفلاتر.</div>'}`
}

async function exportCurrentStock(){
 if(!(await ensureXLSX()))return;

 const rows=state.items.map(i=>({
 الكود:i.code,
 الصنف:i.name,
 النوع:typeName(i.type),
 الوحدة:i.unit,
 رصيد_أول_المدة:n(i.opening),
 إجمالي_الوارد:state.moves.filter(m=>m.code===i.code&&m.date<=today()&&movementSign(m.type)>0).reduce((a,m)=>a+n(m.qty),0),
 إجمالي_المنصرف:state.moves.filter(m=>m.code===i.code&&m.date<=today()&&movementSign(m.type)<0).reduce((a,m)=>a+n(m.qty),0),
 الرصيد_الحالي:stock(i.code),
 قيمة_الرصيد:Math.max(0,stock(i.code))*cost(i.code)
 }));

 const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'الرصيد الحالي');
 XLSX.writeFile(wb,'I_lock_Current_Stock.xlsx')
}

function renderItems(){
 el('items').innerHTML=`
 <div class="section-title"><h2>دليل الأصناف والأكواد</h2><button class="btn success" onclick="itemForm()">+ إضافة صنف</button></div>

 <div class="card">
 <div class="toolbar">
 <div class="field wide"><label>بحث</label><input id="itemSearch" placeholder="الكود أو اسم الصنف"></div>
 <div class="field"><label>نوع الصنف</label><select id="itemTypeFilter"><option value="">الكل</option><option value="raw">خام</option><option value="finished">منتج تام</option><option value="component">مكون</option><option value="other">أخرى</option></select></div>
 <button class="btn light" onclick="renderItems()">تحديث</button>
 </div>
 <div id="itemsTable"></div>
 </div>`;

 const draw=()=>{
 let q=(el('itemSearch')?.value||'').toLowerCase(),t=el('itemTypeFilter')?.value||'';
 let arr=state.items.filter(i=>(!q||(i.code+' '+i.name).toLowerCase().includes(q))&&(!t||i.type===t));
 el('itemsTable').innerHTML=tableItems(arr)
 };

 ['itemSearch','itemTypeFilter'].forEach(id=>el(id).addEventListener('input',draw));
 draw()
}

function tableItems(arr){
 if(!arr.length)return '<div class="empty">لا توجد أصناف.</div>';

 return `<div class="table-wrap"><table class="table">
 <thead><tr>
 <th>الكود</th><th>اسم الصنف</th><th>النوع</th><th>الوحدة</th><th>الرصيد</th>
 <th>تكلفة الوحدة</th><th>سعر البيع</th><th>NRV</th><th>قيمة مخزون</th><th>خفض محتمل</th><th>إجراء</th>
 </tr></thead>
 <tbody>
 ${arr.map(i=>`<tr>
 <td>${esc(i.code)}</td>
 <td>${esc(i.name)}</td>
 <td>${typeName(i.type)}</td>
 <td>${esc(i.unit)}</td>
 <td>${money(stock(i.code))}</td>
 <td>${money(i.unitCost)}</td>
 <td>${money(i.sellPrice)}</td>
 <td>${money(nr(i.code))}</td>
 <td>${money(carrying(i.code))}</td>
 <td>${money(writeDown(i.code))}</td>
 <td class="actions">
 <button class="btn light small" onclick="itemForm('${esc(i.code)}')">تعديل</button>
 <button class="btn danger small" onclick="delItem('${esc(i.code)}')">حذف</button>
 </td>

function saveItem(old=''){

 name:el('in').value.trim(),

 sellingCost:n(el('isc').value)
 };

 if(!code||!obj.name)return alert('أدخل الكود واسم الصنف');

 renderItems()
}

 }

function drawAnalysis(){
 let type=el('atype').value,
 d=el('adate').value||today(),
 q=(el('asearch').value||'').toLowerCase(),
 out=el('analysisOut');

 if(type==='family'){
 let arr=state.families.filter(f=>(f.name+' '+f.code).toLowerCase().includes(q));
 out.innerHTML=familyReport(arr,d);
 return
 }

 if(type==='variance'){
 out.innerHTML=varianceReport(d,q);
 return
 }

 if(type==='period'){
 out.innerHTML=periodReport(q);
 return
 }

 let arr=state.items.filter(i=>
 (!q||(i.code+' '+i.name).toLowerCase().includes(q))&&
 (['raw','finished'].includes(type)?i.type===type:true)
 );

 if(type==='ias2')out.innerHTML=iasReport(arr,d);
 else out.innerHTML=itemAnalysisReport(arr,d,type)
}

function itemAnalysisReport(arr,d,type){
 let total=arr.reduce((a,i)=>a+carrying(i.code,d),0),
 low=arr.reduce((a,i)=>a+lowerValue(i.code,d),0),
 wd=arr.reduce((a,i)=>a+writeDown(i.code,d),0);

 return `<div class="grid" style="margin-bottom:12px">
 ${kpi('عدد الأصناف',arr.length,'')}
 ${kpi('قيمة التكلفة',money(total),'')}
 ${kpi('القيمة بعد الاختبار',money(low),'')}
 ${kpi('خفض محتمل',money(wd),'')}
 </div>

 <div class="table-wrap"><table class="table">
 <thead><tr>
 <th>الكود</th><th>الصنف</th><th>الرصيد</th><th>التكلفة/وحدة</th>
 <th>قيمة التكلفة</th><th>NRV/وحدة</th><th>قيمة NRV</th><th>القيمة المستخدمة</th><th>خفض محتمل</th>
 </tr></thead>
 <tbody>
 ${arr.map(i=>`<tr>
 <td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${money(stock(i.code,d))}</td>
 <td>${money(cost(i.code))}</td><td>${money(carrying(i.code,d))}</td>
 <td>${money(nr(i.code))}</td><td>${money(stock(i.code,d)*nr(i.code))}</td>
 <td>${money(lowerValue(i.code,d))}</td><td>${money(writeDown(i.code,d))}</td>
 </tr>`).join('')}
 </tbody></table></div>`
}

function iasReport(arr,d){

function familyReport(arr,d){

 <tbody>
 ${arr.map(f=>{
 let vals=f.components.map(c=>({c,s:stock(c.code,d),cap:Math.floor(stock(c.code,d)/Math.max(1,c.qty))})),

function varianceReport(d,q){
 let arr=state.items.filter(i=>(i.code+' '+i.name).toLowerCase().includes(q)).map(i=>{
 let c=state.counts.find(x=>x.date===d&&x.code===i.code),
 b=stock(i.code,d),
 dev=c?c.qty-b:null;
 return {i,b,actual:c?.qty,dev}
 });

 return `<div class="table-wrap"><table class="table">
 <thead><tr><th>الصنف</th><th>دفترى</th><th>فعلى</th><th>الانحراف</th><th>قيمة الانحراف</th><th>الحالة</th></tr></thead>
 <tbody>
 ${arr.map(x=>`<tr>
 <td>${esc(x.i.name)}</td><td>${money(x.b)}</td><td>${x.actual==null?'—':money(x.actual)}</td>
 <td>${x.dev==null?'—':money(x.dev)}</td>
 <td>${x.dev==null?'—':money(x.dev*cost(x.i.code))}</td>
 <td>${x.dev==null?'لم يُجرد':x.dev<0?'نقص':x.dev>0?'زيادة':'مطابق'}</td>
 </tr>`).join('')}
 </tbody></table></div>`
}

function periodReport(q){
 let arr=state.plans.filter(p=>(item(p.code)?.name+' '+p.code).toLowerCase().includes(q));

 return arr.length?`
 <div class="table-wrap"><table class="table">
 <thead><tr><th>الفترة</th><th>الصنف</th><th>المخطط</th><th>الفعلية</th><th>الفرق</th><th>% التنفيذ</th></tr></thead>
 <tbody>
 ${arr.map(p=>{
 let a=state.moves.filter(m=>m.code===p.code&&m.type==='issue'&&m.date>=p.from&&m.date<=p.to).reduce((x,m)=>x+n(m.qty),0);
 return `<tr><td>${p.from} → ${p.to}</td><td>${esc(item(p.code)?.name)}</td><td>${money(p.qty)}</td><td>${money(a)}</td><td>${money(a-p.qty)}</td><td>${p.qty?(a/p.qty*100).toFixed(1):0}%</td></tr>`
 }).join('')}
 </tbody></table></div>`:'<div class="empty">لا توجد بيانات خطط.</div>'
}

function loadScriptOnce(src){
 return new Promise((resolve,reject)=>{
 if([...document.scripts].some(s=>s.src===src)&&window.XLSX){resolve();return}
 const s=document.createElement('script');
 s.src=src;
 s.onload=()=>resolve();
 s.onerror=()=>reject(new Error('تعذر تحميل مكتبة Excel'));
 document.head.appendChild(s)
 })
}

async function ensureXLSX(){
 if(window.XLSX)return true;
 try{
 await loadScriptOnce('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
 return true
 }catch(e){
 alert('تعذر تحميل أداة Excel. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.');
 return false
 }
}

function exportAnalysis(){
 let type=el('atype').value,d=el('adate').value||today(),rows=[];

 if(type==='family'){
 rows=state.families.map(f=>({كود_العائلة:f.code,العائلة:f.name,قدرة_التجميع:familyStock(f.id,d)}))
 }else{
 rows=state.items.map(i=>({
 الكود:i.code,
 الصنف:i.name,
 النوع:typeName(i.type),
 الرصيد:stock(i.code,d),
 تكلفة_الوحدة:cost(i.code),
 قيمة_التكلفة:carrying(i.code,d),
 NRV:nr(i.code),
 قيمة_NR:stock(i.code,d)*nr(i.code),
 القيمة_بعد_IAS2:lowerValue(i.code,d),
 خفض_محتمل:writeDown(i.code,d)
 }))
 }

 let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Analysis');
 XLSX.writeFile(wb,'I_lock_Inventory_Analysis.xlsx')
}

function importExcel(e){
 let f=e.target.files[0];
 if(!f)return;

 let r=new FileReader();

 r.onload=()=>{
 try{
 let data=r.result,rows;

 if(f.name.toLowerCase().endsWith('.json'))
 rows=JSON.parse(data);

 else if(f.name.toLowerCase().endsWith('.csv')){
 let wb=XLSX.read(data,{type:'string'});
 rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})
 }

 else{
 let wb=XLSX.read(data,{type:'array'});
 rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})
 }

 if(!Array.isArray(rows))throw Error('صيغة غير صحيحة');

 let added=0;

 rows.forEach(r=>{
 let code=String(r.الكود||r.code||r['كود الصنف']||'').trim(),
 name=String(r.الصنف||r.name||r['اسم الصنف']||'').trim();

 if(code&&name&&!item(code)){
 state.items.push({
 code,
 name,
 type:String(r.النوع||'other')==='خام'?'raw':String(r.النوع||'')==='منتج تام'?'finished':'other',
 unit:String(r.الوحدة||'قطعة'),
 opening:n(r.الرصيد||r.opening),
 unitCost:n(r.تكلفة_الوحدة||r.unitCost),
 sellPrice:n(r.سعر_البيع||r.sellPrice),
 completionCost:n(r.تكلفة_الإكمال||0),
 sellingCost:n(r.تكاليف_البيع||0),
 costMethod:'weighted'
 });
 added++
 }
 });

 save();
 alert('تم الاستيراد وإضافة '+added+' صنف.');
 renderAnalysis()

 }catch(err){
 alert('تعذر قراءة الملف: '+err.message)
 }
 };

 if(f.name.toLowerCase().endsWith('.json')||f.name.toLowerCase().endsWith('.csv'))
 r.readAsText(f);
 else
 r.readAsArrayBuffer(f)
}

function backup(){
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));

}

function restore(e){
 let f=e.target.files[0];
 if(!f)return;

 let r=new FileReader();

 r.onload=()=>{
 try{
 let x=JSON.parse(r.result);
 if(!x.items||!x.moves)throw Error('ملف غير صالح');
 Object.assign(state,x);
 save();
 alert('تمت الاستعادة');
 location.reload()
 }catch(err){
 alert(err.message)
 }
 };

 r.readAsText(f)
}
