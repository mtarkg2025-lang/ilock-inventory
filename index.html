function drawStock(){let q=($("sq").value\vert{}\vert{}'').toLowerCase(),t=$("st").value,u=$("su").value,f=$("sf").value,a=S.items.filter(i=>(!q||(i.code+' '+i.name).toLowerCase().includes(q))&&(!t||i.type===t)&&(!u||i.unit===u)&&(!f||fam(i.code).some(x=>x.id===f)));let rows=a.map(i=>({i,in:S.moves.filter(m=>m.code===i.code&&sign(m.type)>0).reduce((x,m)=>x+num(m.qty),0),out:S.moves.filter(m=>m.code===i.code&&sign(m.type)<0).reduce((x,m)=>x+num(m.qty),0),s:stock(i.code),v:val(i.code)}));$("stockOut").innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>الكود</th><th>الصنف</th><th>النوع</th><th>الوحدة</th><th>أول المدة</th><th>إجمالي الوارد</th><th>إجمالي المنصرف</th><th>الرصيد الحالي</th><th>قيمة الرصيد</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.i.code)}</td><td>${esc(r.i.name)}</td><td>${typeName(r.i.type)}</td><td>${esc(r.i.unit)}</td><td>${fmt(r.i.opening)}</td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td><b>${fmt(r.s)}</b></td><td>${fmt(r.v)}</td></tr>`).join('')}</tbody></table></div>`}

function saveItem(old){let x={code:$('ic').value.trim(),name:$('in').value.trim(),type:$('ity').value,unit:$('iu').value.trim(),opening:num($('io').value),min:num($('imin').value),max:num($('imax').value),supplier:$('isup').value.trim(),location:$('iloc').value.trim(),cost:num($('icost').value),sell:num($('isell').value),costMethod:$('icm').value,completion:num($('icomp').value),sellingCost:num($('iscost').value),active:true};if(!x.code||!x.name||!x.unit)return alert('أدخل الكود والاسم والوحدة');if(old&&old!==x.code&&(S.moves.some(m=>m.code===old)||S.counts.some(c=>c.code===old)||S.families.some(f=>f.components.some(c=>c.code===old))))return alert('لا يمكن تغيير الكود لأنه مرتبط بسجلات.');let j=S.items.findIndex(i=>i.code===(old||x.code));if(j<0&&it(x.code))return alert('الكود موجود بالفعل');j<0?S.items.push(x):S.items[j]=x;save();itemsPage()}

function delFamily(id){if(confirm('حذف العائلة فقط؟ الأصناف لن تُحذف.')){S.families=S.families.filter(f=>f.id!==id);save();familiesPage()}}
const MOV=[['purchase','استلام شراء'],['production','استلام إنتاج'],['issue','صرف'],['return','مرتجع'],['transferOut','تحويل صادر'],['transferIn','تحويل وارد'],['adjustmentIn','تسوية زيادة'],['adjustmentOut','تسوية نقص']];
function movesPage(){$('moves').innerHTML=`<div class="title"><h2>سجل حركة المخزون</h2><button class="btn success" onclick="moveForm()">+ حركة جديدة</button></div><div class="card"><div class="toolbar">${inp('mf','من تاريخ','0000-00-00','date')}${inp('mt','إلى تاريخ',today(),'date')}<div class="field"><label>الصنف</label>${opts('mfi')}</div>${sel('mft','نوع الحركة','',[['','الكل'],...MOV])}<button class="btn light" onclick="drawMoves()">تطبيق</button></div><div class="note">السجل الكامل يحتوي على الصنف والوحدة والكمية ونوع الحركة والمورد/المستلم/الجهة والمرجع والوردية. الرصيد يحسب تلقائيًا.</div><div id="movesOut"></div></div>`;drawMoves()}
function moveForm(){$('moves').innerHTML=`<div class="title"><h2>تسجيل حركة مخزنية كاملة</h2><button class="btn light" onclick="movesPage()">رجوع</button></div><div class="card"><div class="form">${inp('md','التاريخ',today(),'date')}<div class="field"><label>الصنف</label>${opts('mc')}</div>${sel('mk','نوع الحركة','purchase',MOV)}${inp('mq','الكمية',1,'number')}${inp('mu','الوحدة','—','text',true)}${inp('mref','رقم/مرجع المستند','')}${inp('msup','المورد','')}${inp('mrec','المستلم','')}${inp('mreq','طالب الصرف / الجهة','')}${inp('mwh','المخزن / الموقع','')}${sel('mshift','الوردية','نهار',[['نهار','نهار'],['ليل','ليل']])}<div class="full"><label>ملاحظات</label><textarea id="mn"></textarea></div><div class="full note">استلام شراء يتطلب المورد، واستلام الإنتاج يتطلب المستلم، والصرف يتطلب المستلم أو الجهة/الطالب.</div><div class="full"><button class="btn success" onclick="saveMove()">حفظ الحركة</button></div></div></div>`;$('mc').onchange=()=>{$('mu').value=it($('mc').value)?.unit||'—'};}
function saveMove(){let x=it($('mc').value),m={id:uid('M'),date:$('md').value,code:$('mc').value,type:$('mk').value,qty:num($('mq').value),unit:x?.unit\vert{}\vert{}'',ref:$('mref').value.trim(),supplier:$('msup').value.trim(),receiver:$('mrec').value.trim(),requester:$('mreq').value.trim(),warehouse:$('mwh').value.trim(),shift:$('mshift').value,note:$('mn').value.trim()};if(!m.date||!x||m.qty<=0)return alert('أكمل التاريخ والصنف والكمية');if(m.type==='purchase'&&!m.supplier)return alert('سجل المورد');if(m.type==='production'&&!m.receiver)return alert('سجل المستلم');if(m.type==='issue'&&!m.receiver&&!m.requester)return alert('سجل المستلم أو الجهة');S.moves.push(m);save();movesPage()}
function drawMoves(){let f=$('mf').value,t=$('mt').value,c=$('mfi').value,k=$('mft').value,a=S.moves.filter(m=>m.date>=f&&m.date<=t&&(!c\vert{}\vert{}m.code===c)&&(!k\vert{}\vert{}m.type===k));$('movesOut').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>التاريخ</th><th>الكود</th><th>الصنف</th><th>الوحدة</th><th>الحركة</th><th>الكمية</th><th>المورد</th><th>المستلم/الجهة</th><th>المرجع</th><th>الوردية</th><th>الرصيد بعد الحركة</th><th></th></tr></thead><tbody>${a.sort((x,y)=>y.date.localeCompare(x.date)).map(m=>`<tr><td>${m.date}</td><td>${esc(m.code)}</td><td>${esc(it(m.code)?.name)}</td><td>${esc(m.unit)}</td><td>${moveName(m.type)}</td><td>${fmt(m.qty)}</td><td>${esc(m.supplier)}</td><td>${esc(m.receiver\vert{}\vert{}m.requester)}</td><td>${esc(m.ref)}</td><td>${esc(m.shift)}</td><td>${fmt(stock(m.code,m.date))}</td><td><button class="btn danger" onclick="delMove('${m.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function delMove(id){if(confirm('حذف الحركة؟')){S.moves=S.moves.filter(m=>m.id!==id);save();drawMoves()}}
function countsPage(){$('counts').innerHTML=`<div class="title"><h2>الجرد والانحراف</h2><button class="btn success" onclick="countForm()">+ إدخال جرد</button></div><div class="card"><div class="toolbar">${inp('cd','تاريخ الجرد',today(),'date')}<div class="field"><label>الصنف</label>${opts('ci')}</div><button class="btn light" onclick="drawCounts()">تطبيق</button></div><div class="note">الانحراف = الجرد الفعلي − الرصيد الدفتري. لا تستخدم القيمة المطلقة بل احتفظ بالإشارة (سالب = نقص، موجب = زيادة).</div><div id="countsOut"></div></div>`;drawCounts()}
function countForm(){$('counts').innerHTML=`<div class="title"><h2>تسجيل جرد فعلي</h2><button class="btn light" onclick="countsPage()">رجوع</button></div><div class="card"><div class="form">${inp('ctd','التاريخ',today(),'date')}${inp('ctno','رقم الجرد/المحضر','INV-'+today().replaceAll('-',''))}<div class="field"><label>الصنف</label>${opts('cti')}</div>${inp('ctq','الكمية الفعلية',0,'number')}${inp('ctn','ملاحظات','')}<div class="full actions"><button class="btn success" onclick="saveCount()">حفظ الجرد</button></div></div></div>`}
function saveCount(){let x={date:$('ctd').value,no:$('ctno').value.trim(),code:$('cti').value,qty:num($('ctq').value),note:$('ctn').value.trim()};if(!x.date||!x.code)return alert('أكمل التاريخ والصنف');let i=S.counts.findIndex(c=>c.date===x.date&&c.code===x.code);i<0?S.counts.push(x):S.counts[i]=x;save();countsPage()}
function drawCounts(){let d=$('cd').value||today(),c=$('ci').value\vert{}\vert{}'',a=S.items.filter(i=>!c\vert{}\vert{}i.code===c).map(i=>{let q=S.counts.find(x=>x.date===d&&x.code===i.code),book=stock(i.code,d),actual=q?.qty,dev=actual==null?null:actual-book;return{i,book,actual,dev,note:q?.note\vert{}\vert{}''}});$('countsOut').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد الدفتري</th><th>الجرد الفعلي</th><th>الانحراف</th><th>قيمة الانحراف</th><th>الحالة</th><th>ملاحظات</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.i.code)}</td><td>${esc(x.i.name)}</td><td>${fmt(x.book)}</td><td>${x.actual==null?'—':fmt(x.actual)}</td><td>${x.dev==null?'—':fmt(x.dev)}</td><td>${x.dev==null?'—':fmt(x.dev*cost(x.i.code))}</td><td>${x.dev==null?'<span class="pill blue">لم يُجرد</span>':x.dev===0?'<span class="pill green">مطابق</span>':x.dev<0?'<span class="pill red">نقص</span>':'<span class="pill amber">زيادة</span>'}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`}
function plansPage(){$('plans').innerHTML=`<div class="title"><h2>الخطط والاستهلاك</h2><button class="btn success" onclick="planForm()">+ إضافة خطة</button></div><div class="card"><div class="toolbar">${inp('pf','من','0000-00-00','date')}${inp('pt','إلى',today(),'date')}<div class="field"><label>الصنف</label>${opts('pi')}</div><button class="btn light" onclick="drawPlans()">تطبيق</button></div><div id="plansOut"></div></div>`;drawPlans()}
function planForm(){$('plans').innerHTML=`<div class="title"><h2>تسجيل خطة استهلاك</h2><button class="btn light" onclick="plansPage()">رجوع</button></div><div class="card"><div class="form">${inp('pstart','من تاريخ',today(),'date')}${inp('pend','إلى تاريخ',today(),'date')}<div class="field"><label>الصنف</label>${opts('pc')}</div>${inp('pq','الكمية المخططة',0,'number')}<div class="full actions"><button class="btn success" onclick="savePlan()">حفظ الخطة</button></div></div></div>`}
function savePlan(){let p={id:uid('P'),from:$('pstart').value,to:$('pend').value,code:$('pc').value,qty:num($('pq').value)};if(!p.code||p.qty<0)return alert('أكمل البيانات');S.plans.push(p);save();plansPage()}
function drawPlans(){let f=$('pf').value\vert{}\vert{}'0000-00-00',t=$('pt').value||'9999-99-99',c=$('pi').value\vert{}\vert{}'',a=S.plans.filter(p=>p.to>=f&&p.from<=t&&(!c\vert{}\vert{}p.code===c));$('plansOut').innerHTML=a.length?`<div class="tablewrap"><table class="table"><thead><tr><th>الفترة</th><th>الكود</th><th>الصنف</th><th>المخطط</th><th>الاستهلاك الفعلي</th><th>الفارق</th><th>نسبة التنفيذ</th></tr></thead><tbody>${a.map(p=>{let act=S.moves.filter(m=>m.code===p.code&&m.type==='issue'&&m.date>=p.from&&m.date<=p.to).reduce((x,m)=>x+num(m.qty),0),diff=act-p.qty,pct=p.qty?act/p.qty*100:0;return `<tr><td>${p.from} → ${p.to}</td><td>${esc(p.code)}</td><td>${esc(it(p.code)?.name)}</td><td>${fmt(p.qty)}</td><td>${fmt(act)}</td><td>${fmt(diff)}</td><td><span class="pill ${pct>100?'red':pct<80?'amber':'green'}">${pct.toFixed(1)}%</span></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد خطط.</div>'}
function analysisPage(){$('analysis').innerHTML=`<div class="title"><h2>تحليل المخزون والتقارير</h2></div><div class="card"><div class="toolbar">${sel('atype','نوع التقرير','all',[['all','كل الأصناف'],['raw','الخامات'],['finished','المنتجات التامة'],['family','العائلات والتجميع'],['variance','الانحراف والجرد'],['period','الخطة والاستهلاك'],['ias2','IAS 2 — التكلفة مقابل NRV']])}${inp('adate','حتى تاريخ',today(),'date')}${inp('aseq','بحث','')}<button class="btn primary" onclick="drawAnalysis()">توليد التقرير</button><button class="btn success" onclick="exportAnalysis()">تصدير Excel</button></div><div id="analysisOut"></div></div>`;drawAnalysis()}
function drawAnalysis(){let t=$('atype').value,d=$('adate').value||today(),q=($('aseq').value\vert{}\vert{}'').toLowerCase();let out=$('analysisOut');if(t==='family'){out.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>العائلة</th><th>المكونات</th><th>قدرة التجميع</th></tr></thead><tbody>${S.families.filter(f=>(f.name+f.code).toLowerCase().includes(q)).map(f=>`<tr><td><b>${esc(f.name)}</b></td><td>${f.components.c?f.components.c.map(c=>esc(it(c.code)?.name)+' × '+c.qty).join('<br>'):'—'}</td><td><span class="pill blue">${fmt(familyCap(f,d))}</span></td></tr>`).join('')}</tbody></table></div>`;return}if(t==='variance'){out.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>الصنف</th><th>دفتري</th><th>فعلي</th><th>الانحراف</th><th>قيمة الانحراف</th><th>الحالة</th></tr></thead><tbody>${S.items.filter(i=>(i.code+i.name).toLowerCase().includes(q)).map(i=>{let c=S.counts.find(x=>x.date<=d&&x.code===i.code),b=stock(i.code,d),dev=c?c.qty-b:null;return `<tr><td>${esc(i.name)}</td><td>${fmt(b)}</td><td>${c?.qty??'—'}</td><td>${dev??'—'}</td><td>${dev==null?'—':fmt(dev*cost(i.code))}</td><td>${dev==null?'لم يُجرد':dev===0?'مطابق':dev<0?'نقص':'زيادة'}</td></tr>`}).join('')}</tbody></table></div>`;return}if(t==='period'){out.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>الفترة</th><th>الصنف</th><th>المخطط</th><th>الفعلية</th><th>الفرق</th></tr></thead><tbody>${S.plans.filter(p=>(it(p.code)?.name+p.code).toLowerCase().includes(q)).map(p=>{let a=S.moves.filter(m=>m.code===p.code&&m.type==='issue'&&m.date>=p.from&&m.date<=p.to&&m.date<=d).reduce((x,m)=>x+num(m.qty),0);return `<tr><td>${p.from} →${p.to}</td><td>${esc(it(p.code)?.name)}</td><td>${fmt(p.qty)}</td><td>${fmt(a)}</td><td>${fmt(a-p.qty)}</td></tr>`}).join('')}</tbody></table></div>`;return}let a=S.items.filter(i=>(!q||(i.code+i.name).toLowerCase().includes(q))&&(t==='all'||i.type===t)),tot=a.reduce((x,i)=>x+val(i.code,d),0),low=a.reduce((x,i)=>x+low(i.code,d),0),w=a.reduce((x,i)=>x+wd(i.code,d),0);out.innerHTML=`<div class="grid" style="margin-bottom:12px"><div class="kpi"><small>عدد الأصناف</small><b>${a.length}</b></div><div class="kpi"><small>إجمالي التكلفة</small><b>${fmt(tot)}</b></div><div class="kpi"><small>قيمة الاختبار (IAS 2)</small><b>${fmt(low)}</b></div><div class="kpi"><small>خفض محتمل</small><b>${fmt(w)}</b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد</th><th>التكلفة</th><th>قيمة التكلفة</th><th>NRV</th><th>قيمة NRV</th><th>خفض محتمل</th></tr></thead><tbody>${a.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${fmt(stock(i.code,d))}</td><td>${fmt(cost(i.code))}</td><td>${fmt(val(i.code,d))}</td><td>${fmt(nrv(i.code))}</td><td>${fmt(stock(i.code,d)*nrv(i.code))}</td><td>${fmt(wd(i.code,d))}</td></tr>`).join('')}</tbody></table></div>`}
function exportAnalysis(){let wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(S.items.map(i=>({كود:i.code,الصنف:i.name,النوع:typeName(i.type),الرصيد:stock(i.code),التكلفة:i.cost,القيمة:val(i.code)})));XLSX.utils.book_append_sheet(wb,ws,'Analysis');XLSX.writeFile(wb,'I_lock_Analysis.xlsx')}
function exportStock(){let wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(S.items.map(i=>({كود:i.code,الصنف:i.name,الرصيد:stock(i.code)})));XLSX.utils.book_append_sheet(wb,ws,'Stock');XLSX.writeFile(wb,'I_lock_Stock.xlsx')}
function dataPage(){$('data').innerHTML=`<div class="title"><h2>البيانات والنسخ الاحتياطي</h2></div><div class="grid2"><div class="card"><h3>نسخ احتياطي واستعادة</h3><p class="muted">تصدير واستعادة كامل قاعدة البيانات بصيغة JSON.</p><div class="actions"><button class="btn success" onclick="backupJSON()">تصدير JSON</button><label class="btn light" style="cursor:pointer">استعادة JSON<input id="resJSON" type="file" accept=".json" class="hidden"></label></div></div><div class="card"><h3>البيانات التجريبية والمسح</h3><p class="muted">تحميل بيانات تجريبية لمصنع حقن أو مسح النظام بالكامل.</p><div class="actions"><button class="btn warning" onclick="loadDemo()">تحميل Demo</button><button class="btn danger" onclick="clearData()">مسح كل البيانات</button></div></div></div>`;$('resJSON').onchange=restoreJSON}
function backupJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='I_lock_Backup.json';a.click()}
function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items)throw Error();Object.assign(S,x);save();alert('تمت الاستعادة');location.reload()}catch{alert('ملف غير صالح')}};r.readAsText(f)}
function clearData(){if(confirm('حذف كل البيانات نهائيًا؟')){localStorage.removeItem(K);location.reload()}}
function loadDemo(){if(!confirm('تحميل بيانات تجريبية؟'))return;Object.assign(S,{items:[{code:'RM001',name:'خام بلاستيك A',type:'raw',unit:'كجم',opening:1000,min:200,cost:80,sell:0},{code:'RM002',name:'خام بلاستيك B',type:'raw',unit:'كجم',opening:600,min:100,cost:95,sell:0},{code:'P001',name:'جسم فيشة',type:'component',unit:'قطعة',opening:5000,min:1000,cost:2.5,sell:0},{code:'F001',name:'فيشة تامة',type:'finished',unit:'قطعة',opening:300,min:50,cost:15,sell:25,completion:2,sellingCost:1}],families:[{id:'fam1',code:'F01',name:'فيشة كاملة',components:[{code:'P001',qty:1}]}],moves:[{id:'m1',date:today(),code:'RM001',type:'issue',qty:150,unit:'كجم',ref:'سحب',supplier:'',receiver:'عامل',requester:'',warehouse:'',shift:'نهار',note:''},{id:'m2',date:today(),code:'P001',type:'production',qty:1000,unit:'قطعة',ref:'حقن',supplier:'',receiver:'مشرف',requester:'',warehouse:'',shift:'نهار',note:''}],counts:[{date:today(),no:'INV-01',code:'P001',qty:4950,note:'عجز بسيط'}],plans:[{id:'p1',from:today(),to:today(),code:'RM001',qty:200}]});save();location.reload()}
show('dashboard');
</script></body></html>
