<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I lock | إدارة المخزون | مصنع الحقن</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--nav:#0b1f33;--nav2:#123a55;--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#687582;--line:#dfe6ec;--green:#17834b;--red:#c43d3d;--amber:#b77a00;--blue:#2468a6;--shadow:0 8px 25px #102b3d12}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:22px 26px;box-shadow:var(--shadow)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0;font-size:26px}.brand .sub{opacity:.85;margin-top:5px;font-size:14px}.badge{background:#ffffff18;border:1px solid #ffffff2e;border-radius:10px;padding:9px 13px;font-size:12px}
nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}nav button{border:0;background:#edf2f6;color:#34424e;border-radius:9px;padding:10px 13px;white-space:nowrap;cursor:pointer;font-weight:700}nav button.active{background:var(--nav);color:#fff}
main{max-width:1500px;margin:auto;padding:20px}.tab{display:none}.tab.active{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field.wide{min-width:240px;flex:1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}button{font-family:inherit}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--nav);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.light{background:#edf2f6;color:#263746}.warning{background:#fff2d1;color:#805800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:28px;font-weight:800;margin-top:7px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:5px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-title h2{font-size:18px;margin:0}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}.table th{background:#f0f4f7;position:sticky;top:0;z-index:1}.table tr:hover td{background:#fafcfd}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.pill.green{background:#e4f5ec;color:#12683d}.pill.red{background:#fde8e8;color:#9d2929}.pill.amber{background:#fff2d1;color:#805800}.pill.blue{background:#e4f0fb;color:#1f5d91}.muted{color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}.note{padding:12px;border-radius:10px;background:#eef5fb;border-right:4px solid var(--blue);font-size:12px;line-height:1.8}.alert{padding:12px;border-radius:10px;background:#fff5e0;border-right:4px solid var(--amber);font-size:12px;line-height:1.8}.danger-note{padding:12px;border-radius:10px;background:#fff0f0;border-right:4px solid var(--red);font-size:12px;line-height:1.8}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form-grid .full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:11px}.chartbox{height:300px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:30px}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:12px}.grid,.grid2,.form-grid{grid-template-columns:1fr}.brand{align-items:flex-start;flex-direction:column}.field,.field.wide{min-width:100%}}
</style>
</head>
<body>
<header><div class="brand"><div><h1>I lock</h1><div class="sub">إدارة المخزون</div><div class="sub">مصنع الحقن</div></div><div class="badge">نظام رقابة وتحليل المخزون — GitHub Edition</div></div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="tab active"></section>
<section id="items" class="tab"></section>
<section id="families" class="tab"></section>
<section id="moves" class="tab"></section>
<section id="counts" class="tab"></section>
<section id="plans" class="tab"></section>
<section id="analysis" class="tab"></section>
<section id="data" class="tab"></section>
</main>
<div class="footer">I lock — إدارة المخزون — مصنع الحقن | البيانات المحلية محفوظة على هذا المتصفح</div>
<script>
const KEY='ilock_inventory_v3';
const tabs=[['dashboard','لوحة الإدارة'],['items','الأصناف والأكواد'],['families','العائلات والتجميع'],['moves','حركة المخزون'],['counts','الجرد والانحراف'],['plans','الخطط والاستهلاك'],['analysis','تحليل المخزون'],['data','البيانات والنسخ الاحتياطي']];
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{items:[],families:[],components:[],moves:[],counts:[],plans:[],settings:{}};
let charts={};
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const n=x=>Number(x)||0;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=x=>n(x).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function el(id){return document.getElementById(id)}
function item(code){return state.items.find(x=>x.code===code)}
function movementSign(type){return ['purchase','return','transferIn','production'].includes(type)?1:-1}
function moveQty(m){return n(m.qty)*movementSign(m.type)}
function stock(code,asOf=today()){let s=n(item(code)?.opening);state.moves.filter(m=>m.code===code&&m.date<=asOf).sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>s+=moveQty(m));return s}
function cost(code){return n(item(code)?.unitCost)}
function nr(code){let i=item(code);if(!i)return 0;let selling=n(i.sellPrice),complete=n(i.completionCost),sellCost=n(i.sellingCost);return Math.max(0,selling-complete-sellCost)}
function carrying(code,asOf=today()){return Math.max(0,stock(code,asOf))*cost(code)}
function lowerValue(code,asOf=today()){return Math.min(carrying(code,asOf),Math.max(0,stock(code,asOf))*nr(code))}
function writeDown(code,asOf=today()){return Math.max(0,carrying(code,asOf)-lowerValue(code,asOf))}
function familyStock(fid,asOf=today()){let f=state.families.find(x=>x.id===fid);if(!f)return 0;let vals=f.components.map(c=>Math.floor(stock(c.code,asOf)/Math.max(1,n(c.qty))));return vals.length?Math.max(0,Math.min(...vals)):0}
function fmtDate(x){return x||''}
function selectItems(name='code',value='',filter=''){let arr=state.items.filter(i=>!filter||i.type===filter);return `<select id="${name}"><option value="">اختر الصنف</option>${arr.map(i=>`<option value="${esc(i.code)}" ${i.code===value?'selected':''}>${esc(i.code)} — ${esc(i.name)}</option>`).join('')}</select>`}
function nav(){el('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t[0]}" class="${i===0?'active':''}">${t[1]}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));}
function show(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));render(id)}
function render(id){({dashboard:renderDashboard,items:renderItems,families:renderFamilies,moves:renderMoves,counts:renderCounts,plans:renderPlans,analysis:renderAnalysis,data:renderData}[id])()}
function kpi(label,value,hint){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint||''}</div></div>`}
function typeName(t){return {raw:'خام',finished:'منتج تام',component:'مكون',other:'أخرى'}[t]||t}
function movementName(t){return {purchase:'شراء',production:'استلام إنتاج',issue:'صرف',return:'مرتجع',transferOut:'تحويل خارج',transferIn:'تحويل داخل'}[t]||t}

function renderDashboard(){
let totalQty=state.items.reduce((a,i)=>a+Math.max(0,stock(i.code)),0),value=state.items.reduce((a,i)=>a+carrying(i.code),0),wd=state.items.reduce((a,i)=>a+writeDown(i.code),0),negative=state.items.filter(i=>stock(i.code)<0).length;
let raw=state.items.filter(i=>i.type==='raw').length,fin=state.items.filter(i=>i.type==='finished').length;
el('dashboard').innerHTML=`<div class="section-title"><h2>لوحة الإدارة الرئيسية</h2><span class="muted small">حتى تاريخ ${today()}</span></div>
<div class="grid">${kpi('عدد الأصناف',state.items.length,'Raw '+raw+' | Finished '+fin)}${kpi('إجمالي الكميات',money(totalQty),'رصيد تقديري من سجل الحركة')}${kpi('قيمة التكلفة',money(value),'Inventory carrying amount قبل اختبار NRV')}${kpi('خفض محتمل',money(wd),'Lower of cost and NRV — IAS 2')}</div>
<div class="grid2" style="margin-top:14px"><div class="card"><div class="section-title"><h2>حالة الرقابة</h2></div><div class="note">النظام يربط بين الرصيد، الحركة، الجرد الفعلي، الخطة، استهلاك الإنتاج، العائلات، وقدرة التجميع. القيم المحاسبية هنا أداة تحليل وليست قيدًا محاسبيًا تلقائيًا.</div><div style="margin-top:12px">${negative?`<div class="danger-note">يوجد ${negative} صنف برصيد سالب. يجب مراجعة الحركات أو الأرصدة الافتتاحية.</div>`:'<div class="note">لا توجد أرصدة سالبة حاليًا.</div>'}</div></div>
<div class="card"><div class="section-title"><h2>توزيع قيمة المخزون</h2></div><div class="chartbox"><canvas id="valueChart"></canvas></div></div></div>
<div class="card" style="margin-top:14px"><div class="section-title"><h2>أصناف تحتاج مراجعة</h2><button class="btn light" onclick="show('analysis')">فتح التحليل</button></div>
${state.items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد</th><th>قيمة المخزون</th><th>خفض محتمل</th><th>الحالة</th></tr></thead><tbody>${state.items.map(i=>{let s=stock(i.code),v=carrying(i.code),w=writeDown(i.code);return `<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${money(s)}</td><td>${money(v)}</td><td>${money(w)}</td><td>${s<0?'<span class="pill red">رصيد سالب</span>':w>0?'<span class="pill amber">مراجعة NRV</span>':'<span class="pill green">طبيعي</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد أصناف حتى الآن.</div>'}</div>`;
if(charts.value)charts.value.destroy();
let top=state.items.map(i=>({name:i.name,value:carrying(i.code),lower:lowerValue(i.code)})).sort((a,b)=>b.value-a.value).slice(0,10);
let ctx=document.getElementById('valueChart');
if(ctx)charts.value=new Chart(ctx,{type:'bar',data:{labels:top.map(x=>x.name),datasets:[{label:'التكلفة',data:top.map(x=>x.value)},{label:'القيمة بعد اختبار NRV',data:top.map(x=>x.lower)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}

function renderItems(){
el('items').innerHTML=`<div class="section-title"><h2>الأصناف والأكواد</h2><button class="btn primary" onclick="itemForm()">+ إضافة صنف</button></div>
<div class="toolbar"><div class="field wide"><label>بحث</label><input id="itemSearch" placeholder="كود أو اسم الصنف" oninput="drawItems()"></div><div class="field"><label>نوع الصنف</label><select id="itemTypeFilter" onchange="drawItems()"><option value="">كل الأنواع</option><option value="raw">خام</option><option value="finished">منتج تام</option><option value="component">مكون</option><option value="other">أخرى</option></select></div></div><div id="itemsOut"></div>`;
drawItems();
}
function drawItems(){
let q=(el('itemSearch')?.value||'').toLowerCase(),typ=el('itemTypeFilter')?.value||'';
let arr=state.items.filter(i=>(!q||(i.code+' '+i.name).toLowerCase().includes(q))&&(!typ||i.type===typ));
el('itemsOut').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>الكود</th><th>اسم الصنف</th><th>النوع</th><th>الوحدة</th><th>الرصيد</th><th>تكلفة الوحدة</th><th>سعر البيع</th><th>NRV</th><th>قيمة المخزون</th><th>خفض محتمل</th><th>إجراء</th></tr></thead><tbody>${arr.length?arr.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${typeName(i.type)}</td><td>${esc(i.unit)}</td><td>${money(stock(i.code))}</td><td>${money(i.unitCost)}</td><td>${money(i.sellPrice)}</td><td>${money(nr(i.code))}</td><td>${money(carrying(i.code))}</td><td>${money(writeDown(i.code))}</td><td><div class="actions"><button class="btn light" onclick="itemForm('${esc(i.code)}')">تعديل</button><button class="btn danger" onclick="deleteItem('${esc(i.code)}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="11" class="empty">لا توجد أصناف مطابقة.</td></tr>`}</tbody></table></div>`;
}
function itemForm(code=''){
let i=item(code)||{code:'',name:'',type:'raw',unit:'قطعة',opening:0,unitCost:0,sellPrice:0,completionCost:0,sellingCost:0,costMethod:'weighted'};
el('itemsOut').innerHTML=`<div class="card"><div class="section-title"><h2>${code?'تعديل صنف':'إضافة صنف جديد'}</h2><button class="btn light" onclick="renderItems()">رجوع</button></div>
<div class="form-grid"><div class="field"><label>كود الصنف</label><input id="f_code" value="${esc(i.code)}" ${code?'readonly':''}></div><div class="field"><label>اسم الصنف</label><input id="f_name" value="${esc(i.name)}"></div><div class="field"><label>نوع الصنف</label><select id="f_type"><option value="raw" ${i.type==='raw'?'selected':''}>خام</option><option value="finished" ${i.type==='finished'?'selected':''}>منتج تام</option><option value="component" ${i.type==='component'?'selected':''}>مكون</option><option value="other" ${i.type==='other'?'selected':''}>أخرى</option></select></div><div class="field"><label>الوحدة</label><input id="f_unit" value="${esc(i.unit)}"></div><div class="field"><label>الرصيد الافتتاحي</label><input id="f_opening" type="number" value="${n(i.opening)}"></div><div class="field"><label>تكلفة الوحدة</label><input id="f_cost" type="number" step="0.0001" value="${n(i.unitCost)}"></div><div class="field"><label>سعر البيع</label><input id="f_sell" type="number" step="0.0001" value="${n(i.sellPrice)}"></div><div class="field"><label>طريقة التكلفة</label><select id="f_method"><option value="weighted" ${i.costMethod==='weighted'?'selected':''}>Weighted Average — المتوسط المرجح</option><option value="fifo" ${i.costMethod==='fifo'?'selected':''}>FIFO</option><option value="specific" ${i.costMethod==='specific'?'selected':''}>Specific Identification — تحديد محدد</option></select></div><div class="field"><label>تكلفة الإكمال</label><input id="f_completion" type="number" step="0.0001" value="${n(i.completionCost)}"></div><div class="field"><label>تكاليف البيع</label><input id="f_selling" type="number" step="0.0001" value="${n(i.sellingCost)}"></div></div>
<div class="actions" style="margin-top:14px"><button class="btn success" onclick="saveItem('${esc(code)}')">حفظ الصنف</button><button class="btn light" onclick="renderItems()">إلغاء</button></div></div>`;
}
function saveItem(oldCode=''){
let code=el('f_code').value.trim(),name=el('f_name').value.trim();
if(!code||!name){alert('أدخل كود واسم الصنف.');return}
if(!oldCode&&item(code)){alert('كود الصنف موجود بالفعل.');return}
let obj={code,name,type:el('f_type').value,unit:el('f_unit').value.trim()||'قطعة',opening:n(el('f_opening').value),unitCost:n(el('f_cost').value),sellPrice:n(el('f_sell').value),completionCost:n(el('f_completion').value),sellingCost:n(el('f_selling').value),costMethod:el('f_method').value};
if(oldCode){let idx=state.items.findIndex(x=>x.code===oldCode);if(idx>=0)state.items[idx]=obj}else state.items.push(obj);
save();renderItems();
}
function deleteItem(code){
let linkedMove=state.moves.some(x=>x.code===code),linkedFamily=state.families.some(f=>f.components.some(c=>c.code===code));
if(linkedMove||linkedFamily){alert('لا يمكن حذف الصنف لأنه مرتبط بحركات أو بعائلة. يمكن تعديل بياناته بدلًا من حذفه.');return}
if(confirm('حذف الصنف؟')){state.items=state.items.filter(x=>x.code!==code);save();renderItems();}
}

function renderFamilies(){
el('families').innerHTML=`<div class="section-title"><h2>العائلات والتجميع</h2><button class="btn primary" onclick="familyForm()">+ إضافة عائلة</button></div>
<div class="note" style="margin-bottom:14px">كل مكون يظل صنفًا مستقلًا في دفتر الأصناف، لكن هنا يتم ربط المكونات لحساب <b>Assembly Capacity — قدرة التجميع</b>. القدرة تحددها أقل كمية يمكن تكوينها من أحد المكونات.</div><div id="familyOut"></div>`;
drawFamilies();
}
function drawFamilies(){
el('familyOut').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>الكود</th><th>العائلة</th><th>المكونات</th><th>قدرة التجميع</th><th>العنصر المحدد</th><th>إجراء</th></tr></thead><tbody>${state.families.length?state.families.map(f=>{let vals=f.components.map(c=>({c,cap:Math.floor(stock(c.code)/Math.max(1,n(c.qty)))})),min=vals.length?Math.max(0,Math.min(...vals.map(x=>x.cap))):0,lim=vals.find(x=>x.cap===min);return `<tr><td>${esc(f.code)}</td><td>${esc(f.name)}</td><td>${f.components.map(c=>`${esc(item(c.code)?.name||c.code)} × ${c.qty}`).join('<br>')}</td><td><span class="pill blue">${min}</span></td><td>${lim?esc(item(lim.c.code)?.name||lim.c.code):'—'}</td><td><button class="btn light" onclick="familyForm('${esc(f.id)}')">تعديل</button><button class="btn danger" onclick="deleteFamily('${esc(f.id)}')">حذف</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">لا توجد عائلات.</td></tr>`}</tbody></table></div>`;
}
function familyForm(id=''){
let f=state.families.find(x=>x.id===id)||{id:uid('fam'),code:'',name:'',components:[]};
el('familyOut').innerHTML=`<div class="card"><div class="section-title"><h2>${id?'تعديل العائلة':'إضافة عائلة'}</h2><button class="btn light" onclick="renderFamilies()">رجوع</button></div>
<div class="form-grid"><div class="field"><label>كود العائلة</label><input id="fam_code" value="${esc(f.code)}"></div><div class="field"><label>اسم العائلة</label><input id="fam_name" value="${esc(f.name)}"></div></div>
<div style="margin-top:16px"><div class="section-title"><h3>المكونات</h3><button class="btn light" onclick="addComponentRow()">+ مكون</button></div><div id="componentRows"></div></div>
<div class="actions" style="margin-top:14px"><button class="btn success" onclick="saveFamily('${esc(id)}')">حفظ العائلة</button></div></div>`;
let rows=f.components.length?f.components:[{code:'',qty:1}];rows.forEach(c=>addComponentRow(c));
}
function addComponentRow(c={code:'',qty:1}){
let box=el('componentRows');if(!box)return;
let div=document.createElement('div');div.className='form-grid';div.style.marginBottom='8px';
div.innerHTML=`<div class="field"><label>المكون</label><select class="comp-code"><option value="">اختر</option>${state.items.map(i=>`<option value="${esc(i.code)}" ${i.code===c.code?'selected':''}>${esc(i.code)} — ${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية المطلوبة للعائلة</label><input class="comp-qty" type="number" min="0.0001" step="0.0001" value="${n(c.qty)||1}"></div><div class="field"><label>&nbsp;</label><button class="btn danger remove-comp">حذف</button></div>`;
div.querySelector('.remove-comp').onclick=()=>div.remove();box.appendChild(div);
}
function saveFamily(id=''){
let code=el('fam_code').value.trim(),name=el('fam_name').value.trim();
if(!code||!name){alert('أدخل كود واسم العائلة.');return}
let components=[...document.querySelectorAll('#componentRows > div')].map(row=>({code:row.querySelector('.comp-code').value,qty:n(row.querySelector('.comp-qty').value)})).filter(x=>x.code&&x.qty>0);
if(!components.length){alert('أضف مكونًا واحدًا على الأقل.');return}
let obj={id:id||uid('fam'),code,name,components},idx=state.families.findIndex(x=>x.id===obj.id);
if(idx>=0)state.families[idx]=obj;else state.families.push(obj);
state.components=state.families.flatMap(f=>f.components);save();renderFamilies();
}
function deleteFamily(id){if(confirm('حذف العائلة؟')){state.families=state.families.filter(x=>x.id!==id);state.components=state.families.flatMap(f=>f.components);save();renderFamilies();}}

function renderMoves(){
el('moves').innerHTML=`<div class="section-title"><h2>حركة المخزون</h2><button class="btn primary" onclick="moveForm()">+ إضافة حركة</button></div>
<div class="toolbar"><div class="field"><label>من تاريخ</label><input id="moveFrom" type="date" onchange="drawMoves()"></div><div class="field"><label>إلى تاريخ</label><input id="moveTo" type="date" value="${today()}" onchange="drawMoves()"></div><div class="field wide"><label>الصنف</label>${selectItems('moveFilter')}</div></div><div id="movesOut"></div>`;
el('moveFilter').onchange=drawMoves;drawMoves();
}
