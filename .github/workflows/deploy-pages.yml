name: Deploy SHADOW to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate bundled data and inline JavaScript
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib, re
          root = pathlib.Path(".")
          db = json.loads(gzip.decompress(base64.b64decode((root / "shadow-planning/injection-database.json.gz.b64").read_text().strip())))
          rates = json.loads(gzip.decompress(base64.b64decode((root / "shadow-planning/production-rates.json.gz.b64").read_text().strip())))
          assert len(db["items"]) == 237, f"Unexpected item count: {len(db['items'])}"
          assert len(db["columns"]) == 18, f"Unexpected item fields: {len(db['columns'])}"
          assert len(rates["rows"]) == 257, f"Unexpected rates row count: {len(rates['rows'])}"
          html = (root / "shadow-planning/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "Inline JavaScript block not found"
          pathlib.Path("/tmp/shadow-inline.js").write_text(scripts[-1])
          print(f"Validated {len(db['items'])} items, {len(db['columns'])} fields, {len(rates['rows'])} source-rate rows")
          PY
          node --check /tmp/shadow-inline.js
          node --check shadow-planning/worker.js
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('.')
          html = (root / 'shadow-planning/index.html').read_text()
          worker = (root / 'shadow-planning/worker.js').read_text()
          required_knowledge = [
              'GLOBAL_SYSTEMS_SYNTHESIS_PROMPT_AR.md', 'CONTROL_GATES_AR.md',
              'AGENT_SYSTEM_PROMPT_AR.md', 'KNOWLEDGE_FRAMEWORK_AR.md',
              'DECISION_PLAYBOOK_AR.md', 'AGENT_ARCHITECTURE_AR.md',
              'ACCEPTANCE_TESTS_AR.md', 'REFERENCE_REGISTER_AR.md'
          ]
          for name in required_knowledge:
              assert name in html, f'Advisor knowledge file not wired into UI: {name}'
              assert (root / 'SHADOW_INVENTORY_ADVISOR' / name).is_file(), f'Missing advisor file: {name}'
          for phrase in ['SHADOW_ACCESS_TOKEN', 'OPENAI_API_KEY', 'Origin not allowed', 'Request too large']:
              assert phrase in worker, f'Missing server guard: {phrase}'
          assert 'لا تخترع' in worker and 'لا تنفذ' in worker, 'Core safety rules missing from system prompt'
          assert not re.search(r'(?i)sk-[A-Za-z0-9]{20,}', html), 'Possible API key pattern found in browser HTML'
          print('Validated advisor knowledge wiring, server guards, and browser-secret scan')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
