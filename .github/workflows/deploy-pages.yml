name: Deploy SHADOW to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate bundled data and inline JavaScript
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib, re
          root = pathlib.Path(".")
          db = json.loads(gzip.decompress(base64.b64decode((root / "shadow-planning/injection-database.json.gz.b64").read_text().strip())))
          rates = json.loads(gzip.decompress(base64.b64decode((root / "shadow-planning/production-rates.json.gz.b64").read_text().strip())))
          assert len(db["items"]) == 237, f"Unexpected item count: {len(db['items'])}"
          assert len(db["columns"]) == 18, f"Unexpected item fields: {len(db['columns'])}"
          assert len(rates["rows"]) == 257, f"Unexpected rates row count: {len(rates['rows'])}"
          html = (root / "shadow-planning/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "Inline JavaScript block not found"
          pathlib.Path("/tmp/shadow-inline.js").write_text(scripts[-1])
          print(f"Validated {len(db['items'])} items, {len(db['columns'])} fields, {len(rates['rows'])} source-rate rows")
          PY
          node --check /tmp/shadow-inline.js
          node --check shadow-planning/worker.js
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path('shadow-planning/movement-ledger.html')
          html = p.read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'Movement ledger inline JavaScript missing'
          pathlib.Path('/tmp/shadow-ledger.js').write_text(scripts[-1])
          for phrase in ['shadow_movement_ledger_pilot_v1', "m.state==='معتمد'", "m.state==='معلق'", 'تصدير سجل الحركات CSV', 'تنزيل نسخة احتياطية JSON', 'id="location"', "norm(m.location||'غير محدد')", "location:m.location||'غير محدد'", 'function resolveMasterItem(', 'loadMasterItems();', 'id="masterCodes"']:
              assert phrase in html, f'Movement ledger control missing: {phrase}'
          main = pathlib.Path('shadow-planning/index.html').read_text()
          assert 'movement-ledger.html' in main, 'Movement ledger navigation link missing'
          assert 'id="movementIntegration"' in main and 'function renderLedgerIntegration' in main, 'Planning dashboard is not linked to movement ledger summary'
          assert 'shadow_movement_ledger_pilot_v1' in main, 'Shared local ledger key missing from planning dashboard'
          assert 'موقع التخزين الداخلي' in html, 'Separate internal storage location field missing'
          assert "'رصيد افتتاحي':'تسوية عجز'" not in html, 'Opening-balance reversal must require manual policy review'
          print('Validated movement ledger, separate storage-location balances, correction policy, backup/export controls, and navigation')
          PY
          node --check /tmp/shadow-ledger.js
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('weight-receiving/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'Weight-receiving inline JavaScript missing'
          pathlib.Path('/tmp/shadow-weight.js').write_text(scripts[-1])
          for phrase in ['injection-database.json.gz.b64', 'shadow_movement_ledger_pilot_v1', 'sendApprovedReceiptToLedger', "meta.approval!=='معتمدة بشريًا'", "Number.isInteger(actual)", "state:'معلق'"]:
              assert phrase in html, f'Weight-receiving integration guard missing: {phrase}'
          assert 'href="../shadow-planning/movement-ledger.html"' in html, 'Weight-receiving navigation to ledger missing'
          print('Validated weight-receiving item-master link and pending-only ledger transfer')
          PY
          node --check /tmp/shadow-weight.js
          node shadow-planning/tests/movement-ledger.test.cjs
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('.')
          html = (root / 'shadow-planning/index.html').read_text()
          worker = (root / 'shadow-planning/worker.js').read_text()
          required_knowledge = [
              'INVENTORY_BRAIN_OPERATING_MODEL_AR.md', 'GLOBAL_SYSTEMS_SYNTHESIS_PROMPT_AR.md', 'CONTROL_GATES_AR.md',
              'AGENT_SYSTEM_PROMPT_AR.md', 'KNOWLEDGE_FRAMEWORK_AR.md',
              'DECISION_PLAYBOOK_AR.md', 'AGENT_ARCHITECTURE_AR.md',
              'ACCEPTANCE_TESTS_AR.md', 'REFERENCE_REGISTER_AR.md'
          ]
          for name in required_knowledge:
              assert name in html, f'Advisor knowledge file not wired into UI: {name}'
              assert (root / 'SHADOW_INVENTORY_ADVISOR' / name).is_file(), f'Missing advisor file: {name}'
          for phrase in ['SHADOW_ACCESS_TOKEN', 'OPENAI_API_KEY', 'Origin not allowed', 'Request too large']:
              assert phrase in worker, f'Missing server guard: {phrase}'
          assert 'لا تخترع' in worker and 'لا تنفذ' in worker, 'Core safety rules missing from system prompt'
          assert 'مراجعة استيراد الأرصدة قبل التحديث' in html, 'Stock import preview guard missing'
          assert 'مطابقات ملتبسة' in html and 'مستبعدة بالكامل' in html, 'Ambiguous/duplicate stock import protections missing'
          assert 'أكواد مكررة بعد التطبيع' in html and 'قيم رقمية سالبة أو غير رقمية' in html, 'Expanded master-data quality checks missing'
          assert 'rateExceptions' in html and 'صفوف معدلات إنتاج مستبعدة' in html, 'Invalid production-rate row guard missing'
          assert 'INVENTORY_BRAIN_OPERATING_MODEL_AR.md' in html, 'Unified inventory brain model not loaded by advisor'
          assert 'COMPARATIVE_SYSTEMS_RESEARCH_AR.md' in html, 'Comparative inventory systems research not loaded by advisor'
          assert (root / 'SHADOW_INVENTORY_ADVISOR' / 'COMPARATIVE_SYSTEMS_RESEARCH_AR.md').is_file(), 'Comparative inventory systems research file missing'
          assert not re.search(r'(?i)sk-[A-Za-z0-9]{20,}', html), 'Possible API key pattern found in browser HTML'
          print('Validated advisor knowledge wiring, server guards, and browser-secret scan')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
