name: Deploy SHADOW to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: ${{ github.event_name == 'pull_request' && 'validation' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate SHADOW independent workspace review controls
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('shadow-independent/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'Independent workspace inline JavaScript missing'
          pathlib.Path('/tmp/shadow-independent.js').write_text(scripts[-1])
          for phrase in ["m.reviewStatus==='APPROVED'", 'function reviewMovement(', 'reviewedBy', 'rejectionReason', 'reviewMovement(', 'الرصيد المعتمد بالقطعة']:
              assert phrase in html, f'Missing independent workspace control: {phrase}'
          print('Validated independent workspace: approved-only balances and review controls')
          PY
          node --check /tmp/shadow-independent.js
      - name: Validate shared SHADOW core integration
        run: |
          node --check shadow-core.js
          python - <<'PY'
          import pathlib
          core = pathlib.Path('shadow-core.js').read_text()
          for rule in ['DATA-01','MOV-01','WEIGHT-01','PLAN-01','GOV-01','PMP-01','SEC-01']:
              assert rule in core, f'Missing shared core rule: {rule}'
          for page, rel in [
              ('shadow-planning/index.html', '../shadow-core.js'),
              ('shadow-planning/movement-ledger.html', '../shadow-core.js'),
              ('weight-receiving/index.html', '../shadow-core.js'),
              ('shadow-pmo/index.html', '../shadow-core.js')
          ]:
              html = pathlib.Path(page).read_text()
              assert f'<script src="{rel}"></script>' in html, f'Shared core not loaded in {page}'
              assert '../shadow-pmo/' in html or page == 'shadow-pmo/index.html', f'PMO navigation missing in {page}'
          main_inventory = pathlib.Path('index.html').read_text()
          assert '<script src="shadow-core.js"></script>' in main_inventory, 'Base inventory UI is not linked to shared SHADOW navigation'
          assert 'ليست سجلًا مركزيًا معتمدًا' in main_inventory, 'Base inventory local-only status must be clear'
          assert 'بيانات محلية منفصلة' in pathlib.Path('shadow-core.js').read_text(), 'Shared core must disclose independent local data stores'
          pmo = pathlib.Path('shadow-pmo/index.html').read_text()
          for token in ['reqText','raidText','decText','kpiName','gates','exportData','importData']:
              assert token in pmo, f'PMO prototype control missing: {token}'
          print('Validated shared SHADOW core, core rules, PMO navigation, and prototype controls')
          PY
      - name: Validate bundled data and inline JavaScript
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib, re
          root = pathlib.Path(".")
          db = json.loads(gzip.decompress(base64.b64decode((root / "shadow-planning/injection-database.json.gz.b64").read_text().strip())))
          rates = json.loads(gzip.decompress(base64.b64decode((root / "shadow-planning/production-rates.json.gz.b64").read_text().strip())))
          assert len(db["items"]) == 237, f"Unexpected item count: {len(db['items'])}"
          assert len(db["columns"]) == 18, f"Unexpected item fields: {len(db['columns'])}"
          assert len(rates["rows"]) == 257, f"Unexpected rates row count: {len(rates['rows'])}"
          root_html = (root / "index.html").read_text()
          root_scripts = re.findall(r"<script>(.*?)</script>", root_html, re.S)
          assert root_scripts, "Root inventory inline JavaScript missing"
          pathlib.Path("/tmp/shadow-root.js").write_text(root_scripts[-1])
          html = (root / "shadow-planning/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "Inline JavaScript block not found"
          pathlib.Path("/tmp/shadow-inline.js").write_text(scripts[-1])
          print(f"Validated {len(db['items'])} items, {len(db['columns'])} fields, {len(rates['rows'])} source-rate rows")
          PY
          node --check /tmp/shadow-root.js
          node --check /tmp/shadow-inline.js
          node --check shadow-planning/worker.js
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('.')
          p = root / 'shadow-planning/movement-ledger.html'
          html = p.read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'Movement ledger inline JavaScript missing'
          pathlib.Path('/tmp/shadow-ledger.js').write_text(scripts[-1])
          for phrase in ['shadow_movement_ledger_pilot_v1', "m.state==='معتمد'", "m.state==='معلق'", 'تصدير سجل الحركات CSV', 'تنزيل نسخة احتياطية JSON', 'id="location"', "norm(m.location||'غير محدد')", "location:m.location||'غير محدد'", 'function resolveMasterItem(', 'loadMasterItems();', 'id="masterCodes"']:
              assert phrase in html, f'Movement ledger control missing: {phrase}'
          main = (root / 'shadow-planning/index.html').read_text()
          assert 'movement-ledger.html' in main, 'Movement ledger navigation link missing'
          assert 'plan-vs-actual.html' in main, 'Plan vs actual comparison navigation link missing'
          comparison = (root / 'shadow-planning/plan-vs-actual.html').read_text()
          assert 'PLAN_VS_ACTUAL_GUIDE_AR.md' in comparison, 'Plan vs actual usage guide link missing'
          assert (root / 'shadow-planning/PLAN_VS_ACTUAL_GUIDE_AR.md').is_file(), 'Plan vs actual usage guide missing'
          assert 'plan-vs-actual-core.js' in comparison, 'Plan vs actual comparison core not linked'
          comparison_scripts = re.findall(r'<script>(.*?)</script>', comparison, re.S)
          assert comparison_scripts, 'Plan vs actual inline JavaScript missing'
          pathlib.Path('/tmp/shadow-plan-vs-actual.js').write_text(comparison_scripts[-1])
          assert 'id="movementIntegration"' in main and 'function renderLedgerIntegration' in main, 'Planning dashboard is not linked to movement ledger summary'
          assert 'shadow_movement_ledger_pilot_v1' in main, 'Shared local ledger key missing'
          assert 'حالة التشغيل الحالية:</b> محلي داخل المتصفح' in main, 'Local-only status must be visible in the planning dashboard'
          assert '../CENTRAL_BACKEND_SETUP_AR.md' in main, 'Central backend setup link missing from dashboard'
          assert 'موقع التخزين الداخلي' in html, 'Separate internal storage location field missing'
          assert "'رصيد افتتاحي':'تسوية عجز'" not in html, 'Opening-balance reversal must require manual policy review'
          print('Validated movement ledger, separate storage-location balances, correction policy, backup/export controls, and navigation')
          PY
          node --check /tmp/shadow-ledger.js
          node --check shadow-planning/plan-vs-actual-core.js
          node --check /tmp/shadow-plan-vs-actual.js
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('central-console.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'Central console JavaScript missing'
          pathlib.Path('/tmp/shadow-central-console.js').write_text(scripts[-1])
          sql = pathlib.Path('supabase/migrations/202610250001_shadow_core.sql').read_text()
          assert not re.search(r'(?m)^as \$(?:\r?\n)', sql), 'Malformed single-dollar SQL function delimiter'
          assert not re.search(r'(?m)^end \$;', sql), 'Malformed SQL function terminator'
          assert '\\n' not in sql, 'Literal escaped newline remains in SQL migration'
          for phrase in ['shadow_source_import_batches','shadow_source_import_rows','create policy shadow_source_batches_admin','create policy shadow_source_rows_admin']:
              assert phrase in sql, f'Missing source staging control: {phrase}'
          assert '../central-console.html' in pathlib.Path('shadow-planning/index.html').read_text(), 'Planning page lacks central console navigation'
          assert './central-console.html' in pathlib.Path('index.html').read_text(), 'Root inventory lacks central console navigation'
          print('Validated central console source, central SQL delimiters, source staging, and navigation')
          PY
          node --check /tmp/shadow-central-console.js
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('.')
          html = (root / 'weight-receiving/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'Weight-receiving inline JavaScript missing'
          pathlib.Path('/tmp/shadow-weight.js').write_text(scripts[-1])
          for phrase in ['injection-database.json.gz.b64', 'shadow_movement_ledger_pilot_v1', 'sendApprovedReceiptToLedger', "meta.approval!=='معتمدة بشريًا'", "Number.isInteger(actual)", "state:'معلق'"]:
              assert phrase in html, f'Weight-receiving integration guard missing: {phrase}'
          assert 'href="../shadow-planning/movement-ledger.html"' in html, 'Weight-receiving navigation to ledger missing'
          assert '../CENTRAL_BACKEND_SETUP_AR.md' in html, 'Central backend setup link missing from weight-receiving UI'
          print('Validated weight-receiving item-master link and pending-only ledger transfer')
          PY
          node --check /tmp/shadow-weight.js
          node shadow-planning/tests/movement-ledger.test.cjs
          node shadow-planning/tests/plan-vs-actual.test.cjs
          node shadow-domain/tests/domain.test.cjs
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('.')
          html = (root / 'shadow-planning/index.html').read_text()
          worker = (root / 'shadow-planning/worker.js').read_text()
          required_knowledge = [
              'INVENTORY_BRAIN_OPERATING_MODEL_AR.md', 'GLOBAL_SYSTEMS_SYNTHESIS_PROMPT_AR.md', 'CONTROL_GATES_AR.md',
              'AGENT_SYSTEM_PROMPT_AR.md', 'KNOWLEDGE_FRAMEWORK_AR.md',
              'DECISION_PLAYBOOK_AR.md', 'AGENT_ARCHITECTURE_AR.md',
              'ACCEPTANCE_TESTS_AR.md', 'REFERENCE_REGISTER_AR.md', 'PMP_PMO_CORE_NOTE.md',
              'KNOWLEDGE_SOURCE_MAP_PMP_PMO_AR.md', 'SHADOW_PMO_DELIVERY_ROADMAP_AR.md', 'PMO_ACCEPTANCE_TESTS_AR.md'
          ]
          for name in required_knowledge:
              assert name in html, f'Advisor knowledge file not wired into UI: {name}'
              assert (root / 'SHADOW_INVENTORY_ADVISOR' / name).is_file(), f'Missing advisor file: {name}'
          for phrase in ['SHADOW_ACCESS_TOKEN', 'OPENAI_API_KEY', 'Origin not allowed', 'Request too large']:
              assert phrase in worker, f'Missing server guard: {phrase}'
          assert 'لا تخترع' in worker and 'لا تنفذ' in worker, 'Core safety rules missing from system prompt'
          assert 'مراجعة استيراد الأرصدة قبل التحديث' in html, 'Stock import preview guard missing'
          assert 'مطابقات ملتبسة' in html and 'مستبعدة بالكامل' in html, 'Ambiguous/duplicate stock import protections missing'
          assert 'أكواد مكررة بعد التطبيع' in html and 'قيم رقمية سالبة أو غير رقمية' in html, 'Expanded master-data quality checks missing'
          assert 'rateExceptions' in html and 'صفوف معدلات إنتاج مستبعدة' in html, 'Invalid production-rate row guard missing'
          assert 'INVENTORY_BRAIN_OPERATING_MODEL_AR.md' in html, 'Unified inventory brain model not loaded by advisor'
          assert 'COMPARATIVE_SYSTEMS_RESEARCH_AR.md' in html, 'Comparative inventory systems research not loaded by advisor'
          for name in ['PMP_PMO_CORE_NOTE.md', 'KNOWLEDGE_SOURCE_MAP_PMP_PMO_AR.md', 'SHADOW_PMO_DELIVERY_ROADMAP_AR.md', 'PMO_ACCEPTANCE_TESTS_AR.md']:
              assert name in html, f'PMO knowledge not wired into advisor: {name}'
          assert (root / 'SHADOW_INVENTORY_ADVISOR' / 'COMPARATIVE_SYSTEMS_RESEARCH_AR.md').is_file(), 'Comparative inventory systems research file missing'
          assert not re.search(r'(?i)sk-[A-Za-z0-9]{20,}', html), 'Possible API key pattern found in browser HTML'
          print('Validated advisor knowledge wiring, server guards, and browser-secret scan')
          sql = (root / 'supabase/migrations/202610250001_shadow_core.sql').read_text()
          for phrase in [
              'create table if not exists public.shadow_profiles',
              'create table if not exists public.shadow_items',
              'create table if not exists public.shadow_documents',
              'create table if not exists public.shadow_document_lines',
              'create table if not exists public.shadow_audit_events',
              'alter table public.shadow_documents enable row level security',
              'alter table public.shadow_document_lines enable row level security',
              'create or replace view public.shadow_stock_balances',
              'public.shadow_submit_document',
              'public.shadow_approve_document',
              'public.shadow_reject_document',
              'public.shadow_create_correction',
              'public.shadow_approve_production_plan',
              'public.shadow_plan_component_requirements',
              'public.shadow_plan_component_exceptions',
              'pg_advisory_xact_lock',
              'Maker-checker rule',
              'Approved/void documents are immutable',
              'grant execute on function public.shadow_role() to authenticated;'
          ]:
              assert phrase in sql, f'Central schema control missing: {phrase}'
          assert "join public.shadow_documents d on d.id=l.document_id and d.status='approved'" in sql, 'Stock balance view must use approved documents only'
          assert 'revoke all on all tables in schema public from anon;' in sql, 'Anonymous table access must be revoked'
          assert (root / 'CENTRAL_BACKEND_SETUP_AR.md').is_file(), 'Central backend setup guide missing'
          assert (root / 'SHADOW_CENTRAL_DATA_CONTRACT_AR.md').is_file(), 'Central data contract missing'
          print('Validated central schema, role controls, audit, approved-only balances, and setup docs')
          PY
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
