<!doctype html><html lang="ar" dir="rtl"><head><base target="_top"><meta charset="utf-8"><style>
body{margin:0;background:#f5f7fb;color:#193b5b;font:13px Tahoma,Arial}.head{background:#163b62;color:#fff;padding:18px}.head b{font-size:18px}.head small{display:block;opacity:.78;margin-top:4px}.wrap{padding:14px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi,.card{background:#fff;border:1px solid #dfE8ef;border-radius:9px;padding:11px;margin-bottom:10px}.kpi span{display:block;color:#687582;font-size:11px}.kpi b{font-size:19px;margin-top:4px;display:block}.card h3{font-size:13px;margin:0 0 10px}.risk{border-bottom:1px solid #eef1f4;padding:7px 0}.risk:last-child{border:0}.risk small{color:#718194}.danger{color:#a52929}.btn{border:0;border-radius:7px;padding:9px 11px;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#0e4f88;color:#fff}.light{background:#eaf2fb;color:#174e80}.actions{display:flex;gap:7px;margin:11px 0}.form{display:none}.form.show{display:block}label{font-size:11px;color:#687582;display:block;margin:8px 0 3px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dbe4ed;border-radius:6px;padding:8px;font:inherit}textarea{resize:vertical}.toast{padding:9px;background:#e5f6ec;color:#12683d;border-radius:7px;display:none;margin-bottom:10px}.loading{color:#718194;text-align:center;padding:16px}
</style></head><body><div class="head"><b>I LOCK ERP</b><small>مركز عمليات المخزون • Google Workspace</small></div><div class="wrap"><div id="toast" class="toast"></div><div id="app" class="loading">جاري تحميل بيانات المخزون…</div></div><script>
let state={items:[]};const $=x=>document.getElementById(x),num=x=>Number(x||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
function load(){google.script.run.withSuccessHandler(d=>{state=d;render()}).withFailureHandler(fail).getDashboardData()}
function render(){const k=state.kpis; $('app').innerHTML=`<div class="kpis"><div class="kpi"><span>قيمة المخزون</span><b>${num(k.totalValue)}</b></div><div class="kpi"><span>الأصناف النشطة</span><b>${num(k.activeItems)}</b></div><div class="kpi"><span>تنبيهات الطلب</span><b>${num(k.alerts)}</b></div><div class="kpi"><span>حركات اليوم</span><b>${num(k.todayMoves)}</b></div></div><div class="actions"><button class="btn primary" onclick="toggle('move')">+ حركة</button><button class="btn light" onclick="toggle('count')">بدء جرد</button></div><div class="card form" id="move"><h3>مستند حركة مخزون</h3>${movementForm()}<button class="btn primary" onclick="submitMove()">حفظ المستند</button></div><div class="card form" id="count"><h3>محضر جرد</h3>${countForm()}<button class="btn primary" onclick="submitCount()">حفظ الجرد</button></div><div class="card"><h3>متابعة إعادة الطلب</h3>${state.risks.length?state.risks.map(r=>`<div class="risk ${r.balance<0?'danger':''}"><b>${esc(r.name)}</b><br><small>${esc(r.code)} • ${esc(r.warehouse)} • الرصيد ${num(r.balance)} / الحد ${num(r.reorderPoint)} ${esc(r.unit)}</small></div>`).join(''):'<small>لا توجد تنبيهات حالياً.</small>'}</div>`}
function opts(){return '<option value="">اختر الصنف</option>'+state.items.map(i=>`<option value="${esc(i.code)}">${esc(i.code)} — ${esc(i.name)}</option>`).join('')}
function movementForm(){return `<label>التاريخ</label><input id="mDate" type="date" value="${today()}"><label>الصنف</label><select id="mItem">${opts()}</select><label>نوع الحركة</label><select id="mType"><option value="purchase">استلام شراء</option><option value="production">استلام إنتاج</option><option value="issue">صرف إنتاج / طلبية</option><option value="customerReturn">مرتجع عميل</option><option value="transferIn">تحويل وارد</option><option value="transferOut">تحويل صادر</option><option value="adjustmentIn">تسوية زيادة</option><option value="adjustmentOut">تسوية نقص</option></select><label>الكمية</label><input id="mQty" type="number" min=".001"><label>مرجع المستند</label><input id="mRef" placeholder="PO / WO / SO"><label>ملاحظات</label><textarea id="mNotes"></textarea>`}
function countForm(){return `<label>تاريخ الجرد</label><input id="cDate" type="date" value="${today()}"><label>الصنف</label><select id="cItem">${opts()}</select><label>الكمية الفعلية</label><input id="cQty" type="number" min="0"><label>اسم القائم بالجرد</label><input id="cCounter"><label>ملاحظات</label><textarea id="cNotes"></textarea>`}
function toggle(id){$('move').classList.toggle('show',id==='move');$('count').classList.toggle('show',id==='count')}
function submitMove(){google.script.run.withSuccessHandler(r=>{notify(r.message);load()}).withFailureHandler(fail).saveMovement({date:$('mDate').value,itemCode:$('mItem').value,movementType:$('mType').value,quantity:$('mQty').value,reference:$('mRef').value,notes:$('mNotes').value})}
function submitCount(){google.script.run.withSuccessHandler(r=>{notify(r.message);toggle('');}).withFailureHandler(fail).saveCount({date:$('cDate').value,itemCode:$('cItem').value,quantity:$('cQty').value,counter:$('cCounter').value,notes:$('cNotes').value})}
function notify(s){let x=$('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',3500)}function fail(e){notify(e.message||e);$('toast').style.background='#fde8e8';$('toast').style.color='#9d2929'}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();
</script></body></html>
